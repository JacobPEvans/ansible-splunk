---
# Splunk Enterprise configuration group variables

# Service configuration
splunk_admin_user: admin
splunk_service_state: started
splunk_service_enabled: true

# Enable Java for Splunk DB Connect
splunk_docker_java_enabled: true

# Install MS SQL Server JDBC driver for DB Connect
splunk_docker_mssql_driver_enabled: true

# Data disk configuration
# The index volume is created and mounted by tofu-proxmox cloud-init, not by
# Ansible; nothing here consumed the previous device/mount variables. The role
# discovers the backing device from mount facts instead of assuming a device
# node, which matters because the VM's disk layout has drifted from its
# declaration. Reserved-block tuning is governed by
# splunk_docker_data_disk_reserved_percent in the role defaults.

# Managed service users. The Hermes AI agent gets its own Splunk identity so it
# can search/read the environment via the Splunk MCP Server (Bearer token =
# SPLUNK_MCP_TOKEN, minted per-user). Admin role for now — narrow to a custom
# read/search role once the access pattern is known.
splunk_docker_manage_users: true
splunk_docker_users:
  - name: hermes
    roles:
      - admin

# Publish the shared Splunk MCP connection (SPLUNK_MCP_URL + minted
# SPLUNK_MCP_TOKEN) to OpenBao secret/ai/mcp/splunk. Requires a write-capable
# OpenBao AppRole token (BAO_ADDR/BAO_TOKEN) in the converge environment.
splunk_docker_token_publish_openbao: true

# Archive frozen buckets rather than deleting them.
#
# Splunk's default when a bucket ages out is deletion. That was inert here for
# an accidental reason — the per-index quotas were larger than the disk holding
# them, so nothing could ever bind and nothing ever froze. It stops being inert
# the moment a volume cap is set, and at that point "reclaim space" and "lose
# data" become the same action.
#
# So this is switched on FIRST and independently, well before any cap. Enabled
# with no caps set it changes nothing observable: nothing is freezing yet. That
# is the point — it is in place and proven before it is needed.
#
# The upload path was verified end to end against the real endpoint: a bucket
# archived, restored, and compared byte for byte. Restore procedure is in the
# runbooks under "Splunk frozen buckets".
splunk_docker_frozen_archive_enabled: true
