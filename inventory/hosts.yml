---
# Static inventory for fallback when OpenTofu inventory is unavailable
# Prefer dynamic inventory: playbooks import inventory/load_tofu.yml, which
# resolves TOFU_INVENTORY_PATH -> the RustFS published artifact. There is
# deliberately no local-cache step (see AGENTS.md "Inventory freshness").
#
# Static fallback addressing (this file): SPLUNK_VM_HOST, and nothing else.
#
# This file deliberately does NOT restate the VM's hostname. The hostname is
# declared once, in deployment.json, and flows out through the published tofu
# inventory (splunk_vm.splunk.hostname) to DNS and to load_tofu.yml. A default
# spelled here would be a second copy of that name, and a second copy goes stale
# silently: on a rename the fallback keeps resolving an A-record that no longer
# exists, so the run fails at authentication rather than at addressing, which is
# a much harder failure to read.
#
# DNS is still the independent emergency path — an operator reaching for it just
# names the host explicitly:  SPLUNK_VM_HOST=<hostname>.{PROXMOX_DOMAIN}
#
# Connection settings MUST match the dynamic path in load_tofu.yml, or the
# fallback resolves a reachable host and then fails to authenticate against it.
# The VM image only permits the 'debian' user (root logins are refused by
# sshd's forced command) and expects the key at PROXMOX_SSH_KEY_PATH.

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become: false
  children:
    splunk:
      hosts:
        splunk-01:
          ansible_host: "{{ lookup('env', 'SPLUNK_VM_HOST') | mandatory }}"
          ansible_user: debian
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | mandatory }}"
          ansible_python_interpreter: /usr/bin/python3
