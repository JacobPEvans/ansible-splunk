---
# Static inventory for fallback when OpenTofu inventory is unavailable
# Prefer dynamic inventory: playbooks import inventory/load_tofu.yml, which
# resolves TOFU_INVENTORY_PATH -> the RustFS published artifact. There is
# deliberately no local-cache step (see AGENTS.md "Inventory freshness").
#
# Static fallback addressing (this file): SPLUNK_VM_HOST wins when set;
# otherwise DNS-first — the VM's hostname A-record splunk-aio.{PROXMOX_DOMAIN}
# (Technitium derives it from the same tofu inventory).
#
# Connection settings MUST match the dynamic path in load_tofu.yml, or the
# fallback resolves a reachable host and then fails to authenticate against it.
# The VM image only permits the 'debian' user (root logins are refused by
# sshd's forced command) and expects the key at PROXMOX_SSH_KEY_PATH.

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become: false
  children:
    splunk:
      hosts:
        splunk-01:
          ansible_host: "{{ lookup('env', 'SPLUNK_VM_HOST') | default('splunk-aio.' ~ lookup('env', 'PROXMOX_DOMAIN'), true) }}"
          ansible_user: debian
          ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | mandatory }}"
          ansible_python_interpreter: /usr/bin/python3
