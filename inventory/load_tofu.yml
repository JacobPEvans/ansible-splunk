---
# Pre-playbook that loads OpenTofu infrastructure data dynamically
# This playbook runs first to populate the Ansible inventory from OpenTofu outputs,
# eliminating hardcoded VM IPs from Ansible configuration.

- name: Load OpenTofu Infrastructure Inventory
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    # Resolution order is the shared role's; DNS remains the deliberately
    # independent emergency path, which is why this play tolerates an
    # unresolved inventory and falls through to the static check below.
    - name: Resolve the published OpenTofu inventory
      ansible.builtin.include_role:
        name: dryvist.homelab.inventory_resolve
      vars:
        inventory_resolve_required_keys: [splunk_vm]
        inventory_resolve_fail_when_unresolved: false

    # Static fallback (hosts.yml splunk-01) needs SPLUNK_VM_HOST, named
    # explicitly. The hostname is not defaulted anywhere outside deployment.json
    # — see hosts.yml for why a second copy of it is a silent-staleness bug.
    - name: Fail when no inventory source resolves and no static fallback exists
      ansible.builtin.fail:
        msg: |
          OpenTofu inventory could not be resolved from any source:
            1. TOFU_INVENTORY_PATH : {{ lookup('env', 'TOFU_INVENTORY_PATH') | default('(unset)', true) }}
            2. RustFS artifact     : {{ inventory_resolve_s3_effective | default('(OpenBao unavailable)', true) }}

          Provide ONE of:
            - BAO_ADDR and BAO_TOKEN with access to
              secret/platform/object-storage; optionally set
              TOFU_INVENTORY_S3_URI to override the RustFS object.
            - TOFU_INVENTORY_PATH pointing at a local copy (tests / DR override).
            - Re-run the tofu-proxmox Terrakube workspace so the RustFS artifact is republished.
            - Static fallback: SPLUNK_VM_HOST=<hostname>.<domain>, naming the
              VM explicitly (its hostname is declared in deployment.json and
              published as splunk_vm.splunk.hostname).
      when:
        - tofu_inventory_resolved is not defined
        - not (lookup('env', 'SPLUNK_VM_HOST') | default(''))

    - name: Add Splunk VM to inventory (SSH connection)
      ansible.builtin.add_host:
        name: splunk
        groups:
          - splunk
          - all
        ansible_host: "{{ tofu_data.splunk_vm.splunk.ip }}"
        ansible_connection: "{{ tofu_data.splunk_vm.splunk.ansible_connection | default('ssh') }}"
        # NOTE:
        #   The 'debian' user must have passwordless sudo on the target host.
        #   Downstream playbooks (e.g. deploy_docker.yml) use 'become: true'
        #   and rely on this user being able to escalate privileges via sudo
        #   without requiring an interactive password.
        ansible_user: debian
        ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | mandatory }}"
        ansible_python_interpreter: /usr/bin/python3
        hostname: "{{ tofu_data.splunk_vm.splunk.hostname }}"
        vmid: "{{ tofu_data.splunk_vm.splunk.vmid }}"
      when:
        - tofu_data is defined
        - tofu_data.splunk_vm.splunk is defined

    # Splunk-native HA cluster hosts (Phase 3). The tofu `vms` map publishes the
    # cluster VMs (each tagged `splunk` + one of splunk-idx/splunk-sh/splunk-mgmt)
    # into tofu_data.vms. Group each guest into the splunk.splunk role's canonical
    # groups by its role tag, plus a friendly splunk_idx/splunk_sh/splunk_mgmt
    # group (group_vars) and the shared splunk_cluster group. Coexists with the
    # legacy AIO `splunk` host above during migration.
    - name: Add Splunk cluster hosts to inventory (SSH connection)
      ansible.builtin.add_host:
        name: "{{ item.value.hostname }}"
        groups: "{{ ['all', 'full', 'splunk_cluster'] + _splunk_role_groups[_tag] }}"
        ansible_host: "{{ item.value.ip }}"
        ansible_connection: "{{ item.value.ansible_connection | default('ssh') }}"
        ansible_user: debian
        ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') | mandatory }}"
        ansible_python_interpreter: /usr/bin/python3
        hostname: "{{ item.value.hostname }}"
        vmid: "{{ item.value.vmid }}"
      vars:
        # First matching role tag wins (each guest carries exactly one).
        _tag: >-
          {{ (['splunk-idx', 'splunk-sh', 'splunk-mgmt']
              | select('in', item.value.tags | default([])) | list | first) | default('') }}
        _splunk_role_groups:
          splunk-idx: ['indexer', 'splunk_idx']
          splunk-sh: ['search', 'splunk_sh']
          splunk-mgmt: ['clustermanager', 'licensemaster', 'dmc', 'search', 'splunk_mgmt']
      loop: "{{ (tofu_data.vms | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.value.hostname | default(item.key) }}"
      when:
        - tofu_data is defined
        - item.value.tags is defined
        - _tag | length > 0

    # Push tofu_data onto every dynamically-added host so roles can access
    # tofu_data.constants.* directly without hostvars['localhost'] indirection.
    - name: Propagate tofu_data to all inventory hosts
      ansible.builtin.set_fact:
        tofu_data: "{{ tofu_data }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] | reject('equalto', 'localhost') | list }}"
      when: tofu_data is defined
