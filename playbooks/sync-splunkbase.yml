---
# Splunkbase → object-storage (RustFS) sync playbook — resolves LATEST, mirrors, writes manifest
#
# For every deployable addons.yml entry with a `splunkbase_id`, resolves the latest release
# from the PUBLIC Splunkbase API (no auth needed for resolution), downloads it with
# the authenticated session, and mirrors it into the `splunk-addons` bucket on the
# RustFS object-storage LXC, tagged `version=X.Y.Z&splunkbase_id=NNNN`. Finally
# writes `manifest.json` (app_dir → {version, filename}) to the bucket — the version
# bridge the air-gapped Splunk VM reads over the LAN to know which apps to (re)extract.
#
# `pin_version` on an entry overrides resolution (hold back a bad release).
#
# The standalone workflow also archives every release exposed by Splunkbase under
# immutable keys and publishes an integrity catalog. The archive is deliberately
# disabled when this file is imported by site.yml: deployment retains its existing
# fail-soft behavior while archival failures stay visible to archive operators.
#
# Idempotent: skips download when the bucket `version` tag already matches the
# resolved latest. Fail-soft: if Splunkbase is unreachable, the whole resolve/sync
# block is rescued — the existing bucket contents + manifest are left intact so a
# deploy can still proceed. This playbook also runs as an in-flow pre-play of
# site.yml; it stays usable standalone for manual/scheduled syncs.
#
# Credentials (Doppler):
#   SPLUNKBASE_USERNAME      / SPLUNKBASE_PASSWORD          — Splunkbase account (download only)
#   OBJECT_STORAGE_ROOT_USER / OBJECT_STORAGE_ROOT_PASSWORD — object-storage bucket write auth
#
# Usage:
#   doppler run -- ansible-playbook playbooks/sync-splunkbase.yml
#
# Runs entirely on localhost (the Ansible controller, which has internet egress).
# The Splunk VM never contacts Splunkbase — air-gap preserved.

- name: Load OpenTofu inventory (for object-storage endpoint)
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Mirror latest Splunkbase add-ons into object storage
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    splunkbase_api: "{{ splunkbase_api_url | default('https://splunkbase.splunk.com') }}"
    splunkbase_sync_tmpdir: /tmp/splunkbase-sync
    object_storage_bucket: splunk-addons
    # mc resolves the `homelab` alias from this env var — no persisted alias file.
    mc_env:
      MC_HOST_homelab: >-
        http://{{ lookup('env', 'OBJECT_STORAGE_ROOT_USER') }}:{{
        lookup('env', 'OBJECT_STORAGE_ROOT_PASSWORD') }}@{{
        hostvars['localhost']['tofu_data']['containers']['s3']['ip'] }}:{{
        hostvars['localhost']['tofu_data']['constants']['service_ports']['object_storage_s3'] }}

  tasks:
    - name: Assert required environment variables are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'SPLUNKBASE_USERNAME') | length > 0
          - lookup('env', 'SPLUNKBASE_PASSWORD') | length > 0
          - lookup('env', 'OBJECT_STORAGE_ROOT_USER') | length > 0
          - lookup('env', 'OBJECT_STORAGE_ROOT_PASSWORD') | length > 0
        fail_msg: >-
          Missing one of SPLUNKBASE_USERNAME, SPLUNKBASE_PASSWORD,
          OBJECT_STORAGE_ROOT_USER, OBJECT_STORAGE_ROOT_PASSWORD. Run via
          `doppler run -- ansible-playbook …` so Doppler injects secrets.

    # Without this, an absent `mc` surfaces as rc=2 from every object-storage
    # command, which the tag-query validation below reports as an object-storage
    # fault - sending the reader to check connectivity, credentials, and bucket
    # existence, none of which are wrong. Fail once, here, naming the real cause.
    - name: Look for the object-storage client
      ansible.builtin.command:
        cmd: mc --version
      changed_when: false
      failed_when: false
      register: mc_preflight

    - name: Assert the object-storage client is installed
      ansible.builtin.assert:
        that:
          - mc_preflight.rc == 0
        fail_msg: >-
          `mc` is not on PATH. Every object-storage command below would exit 2
          ("executable not found"), which reads as an object-storage fault but
          is not one. Install the client into the dev shell and re-run.
        quiet: true

    - name: Load Splunk add-on registry
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/splunk_docker/vars/addons.yml"

    - name: Validate add-on registry schema
      ansible.builtin.assert:
        that:
          - item.filename is defined
          - item.app_dir is defined
          - not (item.splunkbase_id is defined and item.github_repo is defined)
          - item.install is not defined or item.install is boolean
        fail_msg: >-
          Invalid registry entry {{ item }}: each entry must have filename + app_dir
          and may have at most one of (splunkbase_id, github_repo).
      loop: "{{ splunk_docker_addons }}"
      loop_control:
        label: "{{ item.filename | default('(no filename)') }}"

    - name: Validate non-installable reference archive schema
      ansible.builtin.assert:
        that:
          - item.source == 'github_tarball'
          - item.owner is match('^[A-Za-z0-9][A-Za-z0-9-]*$')
          - item.repository is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - item.ref | length > 0
          - item.commit is match('^[a-f0-9]{40}$')
          - item.filename is match('^[A-Za-z0-9][A-Za-z0-9._+-]*$')
          - item.license_status == 'undeclared'
        fail_msg: >-
          Invalid non-installable reference archive {{ item | default({}) }}.
          References must be pinned GitHub tarballs and must declare their
          observed license status without inferring a license.
      loop: "{{ splunk_docker_reference_archives | default([]) }}"
      loop_control:
        label: "{{ item.owner | default('?') }}/{{ item.repository | default('?') }}"

    - name: Build list of Splunkbase-syncable entries
      ansible.builtin.set_fact:
        splunkbase_entries: >-
          {{ splunk_docker_addons | selectattr('splunkbase_id', 'defined') | list }}

    - name: Build list of deployable Splunkbase entries
      ansible.builtin.set_fact:
        splunkbase_install_entries: >-
          {{ (splunkbase_entries | selectattr('install', 'undefined') | list)
             + (splunkbase_entries | selectattr('install', 'defined')
                | selectattr('install', 'equalto', true) | list) }}

    - name: Ensure temporary download directory exists
      ansible.builtin.file:
        path: "{{ splunkbase_sync_tmpdir }}"
        state: directory
        mode: "0700"

    # Resolve → download → mirror → manifest. Wrapped in block/rescue so a
    # Splunkbase outage degrades gracefully: the deploy continues from whatever
    # the object store already holds (the existing manifest is left untouched).
    - name: Resolve latest, sync drifted apps, and publish manifest
      block:
        # PUBLIC endpoint — no auth. Newest release is element [0].
        - name: Resolve latest release per Splunkbase entry
          ansible.builtin.uri:
            url: "{{ splunkbase_api }}/api/v1/app/{{ item.splunkbase_id }}/release/"
            method: GET
            return_content: true
            status_code: 200
            timeout: 30
          register: splunkbase_release_q
          loop: "{{ splunkbase_entries }}"
          loop_control:
            label: "app {{ item.splunkbase_id }}"
          changed_when: false
          failed_when: false

        - name: Compute every resolved release's desired version
          ansible.builtin.set_fact:
            splunkbase_desired_all: >-
              {{ splunkbase_desired_all | default([]) + [item.0 | combine({
                'desired_version': (
                  item.0.pin_version if item.0.pin_version is defined
                  else (
                    (item.1.content | from_json | first).name
                    if (item.1.status | default(0)) == 200
                       and (item.1.content | default('') | trim)[:1] == '['
                       and (item.1.content | from_json | length) > 0
                    else ''
                  )
                )
              })] }}
          loop: "{{ splunkbase_entries | zip(splunkbase_release_q.results) | list }}"
          loop_control:
            label: "{{ item.0.filename }}"

        - name: Warn about entries whose latest version could not be resolved
          ansible.builtin.debug:
            msg: >-
              Could not resolve a version for {{ item.filename }}
              (splunkbase_id {{ item.splunkbase_id }}); skipping it this run.
          loop: "{{ splunkbase_desired_all | selectattr('desired_version', 'equalto', '') | list }}"
          loop_control:
            label: "{{ item.filename }}"

        - name: Keep only deployable resolvable entries
          ansible.builtin.set_fact:
            splunkbase_desired: >-
              {{ ((splunkbase_desired_all | selectattr('install', 'undefined') | list)
                  + (splunkbase_desired_all | selectattr('install', 'defined')
                     | selectattr('install', 'equalto', true) | list))
                 | rejectattr('desired_version', 'equalto', '') | list }}

        # `mc tag list --json` returns nonzero for a missing object ("NoSuchKey"
        # in stdout) — expected, drives a sync. Any other nonzero (auth/network/
        # bucket) must fail loud, validated in the next task.
        - name: Query current object-storage version tag for each entry
          ansible.builtin.command:
            cmd: "mc tag list --json homelab/{{ object_storage_bucket }}/{{ item.filename }}"
          environment: "{{ mc_env }}"
          loop: "{{ splunkbase_desired }}"
          loop_control:
            label: "{{ item.filename }}"
          register: object_storage_tag_query
          changed_when: false
          failed_when: false
          no_log: true

        - name: Validate query errors are only missing-object cases
          ansible.builtin.assert:
            that:
              - item.rc == 0 or 'NoSuchKey' in (item.stdout | default(''))
            fail_msg: >-
              mc tag list failed for {{ item.item.filename }} with rc={{ item.rc }}.
              Not a "missing object" — check object-storage connectivity,
              OBJECT_STORAGE_ROOT_USER/PASSWORD, and bucket existence.
            quiet: true
          loop: "{{ object_storage_tag_query.results }}"
          loop_control:
            label: "{{ item.item.filename }}"

        - name: Compute sync decisions (bucket tag vs resolved latest)
          ansible.builtin.set_fact:
            splunkbase_plan: >-
              {{ splunkbase_plan | default([]) + [item.item | combine({
                'current_version': (
                  (item.stdout | default('{}') | from_json).tagset.version
                  | default('') | trim
                ) if item.rc == 0 else '',
                'needs_sync': (
                  item.rc != 0
                  or ((item.stdout | default('{}') | from_json).tagset.version
                      | default('') | trim) != (item.item.desired_version | string | trim)
                ),
              })] }}
          loop: "{{ object_storage_tag_query.results }}"
          loop_control:
            label: "{{ item.item.filename }}"

        - name: Show sync decisions
          ansible.builtin.debug:
            msg: >-
              {{ item.filename }}: latest={{ item.desired_version }}
              store={{ item.current_version or '(none)' }}
              → {{ 'SYNC' if item.needs_sync else 'skip' }}
          loop: "{{ splunkbase_plan }}"
          loop_control:
            label: "{{ item.filename }}"

        - name: Build list of entries that need sync
          ansible.builtin.set_fact:
            splunkbase_to_sync: "{{ splunkbase_plan | selectattr('needs_sync') | list }}"

        - name: Authenticate to Splunkbase (only when something needs downloading)
          ansible.builtin.uri:
            url: "{{ splunkbase_api }}/api/account:login/"
            method: POST
            body_format: form-urlencoded
            body:
              username: "{{ lookup('env', 'SPLUNKBASE_USERNAME') }}"
              password: "{{ lookup('env', 'SPLUNKBASE_PASSWORD') }}"
            return_content: true
            status_code: 200
          register: splunkbase_login
          when: splunkbase_to_sync | length > 0
          no_log: true

        - name: Extract Splunkbase session token
          ansible.builtin.set_fact:
            splunkbase_token: >-
              {{ splunkbase_login.content
                 | regex_search('<id>([^<]+)</id>', '\1')
                 | default([], true)
                 | first | default('') }}
          when: splunkbase_to_sync | length > 0
          no_log: true

        - name: Fail if session token not returned
          ansible.builtin.assert:
            that:
              - splunkbase_token is defined
              - splunkbase_token | length > 0
            fail_msg: >-
              Splunkbase login returned no session token. Check
              SPLUNKBASE_USERNAME / SPLUNKBASE_PASSWORD in Doppler.
          when: splunkbase_to_sync | length > 0

        - name: Download drifted entries from Splunkbase
          ansible.builtin.get_url:
            url: >-
              {{ splunkbase_api }}/app/{{ item.splunkbase_id }}/release/{{ item.desired_version }}/download/
            dest: "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
            headers:
              X-Auth-Token: "{{ splunkbase_token }}"
            force: true
            mode: "0600"
            timeout: 120
          loop: "{{ splunkbase_to_sync }}"
          loop_control:
            label: "{{ item.filename }} v{{ item.desired_version }}"

        - name: Upload synced archives to object storage
          ansible.builtin.command:
            cmd: >-
              mc cp
              {{ splunkbase_sync_tmpdir }}/{{ item.filename }}
              homelab/{{ object_storage_bucket }}/{{ item.filename }}
          environment: "{{ mc_env }}"
          loop: "{{ splunkbase_to_sync }}"
          loop_control:
            label: "{{ item.filename }}"
          changed_when: true

        - name: Tag object-storage objects with version + splunkbase_id
          ansible.builtin.command:
            cmd: >-
              mc tag set
              homelab/{{ object_storage_bucket }}/{{ item.filename }}
              version={{ item.desired_version | string | trim }}&splunkbase_id={{ item.splunkbase_id }}
          environment: "{{ mc_env }}"
          loop: "{{ splunkbase_to_sync }}"
          loop_control:
            label: "{{ item.filename }}"
          changed_when: true

        - name: Remove downloaded archives from controller tmpdir
          ansible.builtin.file:
            path: "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
            state: absent
          loop: "{{ splunkbase_to_sync }}"
          loop_control:
            label: "{{ item.filename }}"

        # Manifest = the version bridge the air-gapped Splunk VM reads over HTTP.
        # Written from the FULL resolved set (not just synced) so it always
        # reflects what the bucket currently holds.
        - name: Build manifest (app_dir → {version, filename})
          ansible.builtin.set_fact:
            splunkbase_manifest: >-
              {{ splunkbase_manifest | default({}) | combine({
                item.app_dir: {'version': item.desired_version, 'filename': item.filename}
              }) }}
          loop: "{{ splunkbase_desired }}"
          loop_control:
            label: "{{ item.app_dir }}"

        - name: Write manifest to controller tmpdir
          ansible.builtin.copy:
            content: "{{ splunkbase_manifest | to_nice_json }}\n"
            dest: "{{ splunkbase_sync_tmpdir }}/manifest.json"
            mode: "0600"

        - name: Publish manifest.json to object storage
          ansible.builtin.command:
            cmd: >-
              mc cp
              {{ splunkbase_sync_tmpdir }}/manifest.json
              homelab/{{ object_storage_bucket }}/manifest.json
          environment: "{{ mc_env }}"
          changed_when: true

        - name: Remove manifest from controller tmpdir
          ansible.builtin.file:
            path: "{{ splunkbase_sync_tmpdir }}/manifest.json"
            state: absent

        - name: Summary
          ansible.builtin.debug:
            msg: >-
              Splunkbase sync complete.
              {{ splunkbase_to_sync | length }} of
              {{ splunkbase_desired | length }} resolvable entries updated;
              manifest.json published with {{ splunkbase_manifest | length }} apps.

      rescue:
        - name: Splunkbase sync failed — continue from existing object-storage contents (fail-soft)
          ansible.builtin.debug:
            msg: >-
              Splunkbase resolve/sync failed; leaving the bucket + manifest.json as-is and
              proceeding with whatever is already mirrored. Error:
              {{ ansible_failed_result.msg | default('see preceding task') }}

    - name: Query final object-storage version tags
      ansible.builtin.command:
        cmd: "mc tag list --json homelab/{{ object_storage_bucket }}/{{ item.filename }}"
      environment: "{{ mc_env }}"
      loop: "{{ splunkbase_desired | default([]) }}"
      loop_control:
        label: "{{ item.filename }}"
      register: object_storage_final_tag_query
      changed_when: false
      failed_when: false
      when: splunkbase_manifest is defined
      no_log: true

    - name: Verify object-storage tags match resolved Splunkbase versions
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - >-
            ((item.stdout | default('{}', true) | from_json).tagset.version
            | default('') | trim) == (item.item.desired_version | string | trim)
        fail_msg: >-
          object-storage version mismatch for {{ item.item.filename }}:
          expected {{ item.item.desired_version }}, got
          {{ ((item.stdout | default('{}', true) | from_json).tagset.version
             | default('(missing)') | trim) if item.rc == 0 else '(missing object)' }}.
        quiet: true
      loop: "{{ object_storage_final_tag_query.results | default([]) }}"
      loop_control:
        label: "{{ item.item.filename }}"
      when: splunkbase_manifest is defined

    - name: Read published object-storage manifest
      ansible.builtin.command:
        cmd: "mc cat homelab/{{ object_storage_bucket }}/manifest.json"
      environment: "{{ mc_env }}"
      register: object_storage_manifest_verify
      changed_when: false
      failed_when: false
      when: splunkbase_manifest is defined
      no_log: true

    - name: Verify published manifest matches resolved Splunkbase versions
      ansible.builtin.assert:
        that:
          - object_storage_manifest_verify.rc == 0
          - >-
            ((object_storage_manifest_verify.stdout | default('{}', true) | from_json).get(item.app_dir, {}).version
            | default('') | trim) == (item.desired_version | string | trim)
          - >-
            ((object_storage_manifest_verify.stdout | default('{}', true) | from_json).get(item.app_dir, {}).filename
            | default('') | trim) == (item.filename | string | trim)
        fail_msg: >-
          manifest.json mismatch for {{ item.app_dir }}:
          expected {{ item.filename }} at {{ item.desired_version }}
          ({{ 'manifest unreadable' if object_storage_manifest_verify.rc != 0 else 'value drift' }}).
        quiet: true
      loop: "{{ splunkbase_desired | default([]) }}"
      loop_control:
        label: "{{ item.app_dir }}"
      when: splunkbase_manifest is defined

    # Archive is intentionally distinct from the latest-object deployment path:
    # its release catalog is immutable and integrity failures must stop this
    # standalone workflow rather than silently changing a deployment outcome.
    - name: Archive every exposed Splunkbase release and pinned reference
      when: splunkbase_archive_history | default(true) | bool
      block:
        - name: Initialise immutable archive catalog entries
          ansible.builtin.set_fact:
            splunkbase_archive_catalog_entries: []
            splunkbase_archive_releases: []

        - name: Record unavailable Splunkbase release indexes
          ansible.builtin.set_fact:
            splunkbase_archive_catalog_entries: >-
              {{ splunkbase_archive_catalog_entries + [{
                'kind': 'splunkbase_release_index',
                'app_identity': item.0.app_dir,
                'splunkbase_id': item.0.splunkbase_id | int,
                'version': none,
                'filename': none,
                'key': none,
                'sha256': none,
                'size': none,
                'source_url': splunkbase_api ~ '/api/v1/app/' ~ item.0.splunkbase_id ~ '/release/',
                'retrieved_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
                'result': 'release_index_unavailable',
                'entitlement_status': 'unknown',
                'source_http_status': item.1.status | default(none)
              }] }}
          loop: "{{ splunkbase_entries | zip(splunkbase_release_q.results | default([])) | list }}"
          loop_control:
            label: "app {{ item.0.splunkbase_id }}"
          when: >-
            (item.1.status | default(0)) != 200
            or (item.1.content | default('') | trim)[:1] != '['

        - name: Build immutable archive release inventory
          ansible.builtin.set_fact:
            splunkbase_archive_releases: >-
              {{ splunkbase_archive_releases + (
                (item.1.content | from_json)
                | map('combine', {
                    'app_dir': item.0.app_dir,
                    'splunkbase_id': item.0.splunkbase_id
                  }) | list) }}
          loop: "{{ splunkbase_entries | zip(splunkbase_release_q.results | default([])) | list }}"
          loop_control:
            label: "app {{ item.0.splunkbase_id }}"
          when:
            - (item.1.status | default(0)) == 200
            - (item.1.content | default('') | trim)[:1] == '['

        - name: Authenticate to Splunkbase for immutable archive downloads
          ansible.builtin.uri:
            url: "{{ splunkbase_api }}/api/account:login/"
            method: POST
            body_format: form-urlencoded
            body:
              username: "{{ lookup('env', 'SPLUNKBASE_USERNAME') }}"
              password: "{{ lookup('env', 'SPLUNKBASE_PASSWORD') }}"
            return_content: true
            status_code: 200
          register: splunkbase_archive_login
          when: splunkbase_archive_releases | length > 0
          no_log: true

        - name: Extract immutable archive Splunkbase session token
          ansible.builtin.set_fact:
            splunkbase_archive_token: >-
              {{ splunkbase_archive_login.content
                 | regex_search('<id>([^<]+)</id>', '\1')
                 | default([], true)
                 | first | default('') }}
          when: splunkbase_archive_releases | length > 0
          no_log: true

        - name: Assert immutable archive session token is present
          ansible.builtin.assert:
            that:
              - splunkbase_archive_token | length > 0
            fail_msg: >-
              Splunkbase did not return a session token for historical archive
              retrieval. Existing deployment mirror contents were not changed.
          when: splunkbase_archive_releases | length > 0

        - name: Archive every exposed Splunkbase release
          ansible.builtin.include_tasks: tasks/archive-splunkbase-release.yml
          loop: "{{ splunkbase_archive_releases }}"
          loop_control:
            loop_var: splunkbase_archive_release
            label: >-
              {{ splunkbase_archive_release.splunkbase_id }} {{
              splunkbase_archive_release.name }}

        - name: Archive every pinned non-installable reference
          ansible.builtin.include_tasks: tasks/archive-reference.yml
          loop: "{{ splunk_docker_reference_archives | default([]) }}"
          loop_control:
            loop_var: splunk_reference_archive
            label: "{{ splunk_reference_archive.owner }}/{{ splunk_reference_archive.repository }}"

        - name: Build immutable archive catalog
          ansible.builtin.set_fact:
            splunkbase_archive_catalog:
              schema_version: 1
              generated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              entries: "{{ splunkbase_archive_catalog_entries }}"

        - name: Write immutable archive catalog locally
          ansible.builtin.copy:
            content: "{{ splunkbase_archive_catalog | to_nice_json }}\n"
            dest: "{{ splunkbase_sync_tmpdir }}/archive-catalog.json"
            mode: "0600"

        - name: Publish immutable archive catalog
          ansible.builtin.command:
            argv:
              - mc
              - cp
              - "{{ splunkbase_sync_tmpdir }}/archive-catalog.json"
              - "homelab/{{ object_storage_bucket }}/archive/catalog.json"
          environment: "{{ mc_env }}"
          changed_when: true
          no_log: true

        - name: Read published immutable archive catalog
          ansible.builtin.command:
            argv:
              - mc
              - cat
              - "homelab/{{ object_storage_bucket }}/archive/catalog.json"
          environment: "{{ mc_env }}"
          register: splunkbase_archive_catalog_verify
          changed_when: false
          no_log: true

        - name: Verify published immutable archive catalog schema
          ansible.builtin.assert:
            that:
              - (splunkbase_archive_catalog_verify.stdout | from_json).schema_version == 1
              - (splunkbase_archive_catalog_verify.stdout | from_json).entries | length == splunkbase_archive_catalog_entries | length
              - >-
                (splunkbase_archive_catalog_verify.stdout | from_json).entries
                | selectattr('result', 'equalto', 'available')
                | selectattr('sha256', 'defined') | list | length
                == (splunkbase_archive_catalog_entries
                    | selectattr('result', 'equalto', 'available') | list | length)
            fail_msg: >-
              Published archive/catalog.json does not satisfy the immutable
              archive schema or is missing an integrity digest.
            quiet: true

      always:
        - name: Remove local immutable archive catalog
          ansible.builtin.file:
            path: "{{ splunkbase_sync_tmpdir }}/archive-catalog.json"
            state: absent
          changed_when: false
