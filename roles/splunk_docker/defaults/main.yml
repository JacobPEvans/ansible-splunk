---
# Splunk Docker role defaults

# Docker configuration
splunk_docker_package_name: docker.io
splunk_docker_compose_package: docker-compose-plugin

# Splunk container configuration
# Splunk image - use :latest or pin a specific version like 9.1.2 when upgrading.
# Note: If specifying a version not yet pulled, ensure the VM has network access to Docker Hub.
splunk_docker_image: splunk/splunk:latest
splunk_docker_hostname: splunk
splunk_docker_container_name: splunk

# Splunk credentials (from Doppler) - set in playbook vars
splunk_docker_password: ""

# Saved-search alert delivery: ntfy + Slack, never email (operator directive
# 2026-07-16). Empty string disables that channel on every alert (the saved
# search still runs and surfaces in the Splunk UI's Triggered Alerts panel).
#
# ntfy: full topic URL, delivered via Splunk's built-in webhook alert action
# (the URL is allowlisted in alert_actions.conf.j2). Defaults to the keystone
# topic — the same one the hermes brain-watchdog pushes to — derived from
# PROXMOX_DOMAIN when the converge env carries it.
splunk_docker_alert_ntfy_url: >-
  {{ ('https://ntfy.' ~ lookup('env', 'PROXMOX_DOMAIN') ~ '/keystone')
     if lookup('env', 'PROXMOX_DOMAIN') else '' }}
# Slack: incoming-webhook URL for TA-slack-add-on-for-splunk, sourced from the
# shared alerting webhook (RUNSON_ALERT_SLACK_WEBHOOK_URL in the converge env,
# e.g. under `doppler run -p iac-conf-mgmt -c prd`). Rendered into
# alert_actions.conf (0600) — never into savedsearches.conf.
splunk_docker_alert_slack_webhook: >-
  {{ lookup('env', 'RUNSON_ALERT_SLACK_WEBHOOK_URL') | default('', true) }}

# Splunk General Terms acceptance string for SPLUNK_GENERAL_TERMS env var.
# Override in staging to point at non-prod terms acceptance strings if Splunk
# publishes a new SGT version mid-release cycle.
splunk_docker_sgt_accept: "--accept-sgt-current-at-splunk-com"

# HEC token values — dict of { index_name: token_uuid }.
# When HEC_NAMESPACE is set, a dedicated per-index token is derived for each
# index; the 'legacy' shared token always stays = SPLUNK_HEC_TOKEN so it never
# rotates while senders migrate to their per-index tokens (then it is retired).
splunk_docker_hec_token_values: {}

# HEC namespace UUID for per-index token derivation (from Doppler HEC_NAMESPACE).
# Token = 'splunk-hec-<index>' | to_uuid(namespace)  (Ansible core to_uuid =
# uuid5). Any sender with the same namespace derives the identical token, so no
# per-index secret is ever stored or shared — only this namespace UUID is.
splunk_docker_hec_namespace: ""

# Splunk ports
splunk_docker_web_port: 8000
splunk_docker_hec_port: 8088
# Management API port (splunkd REST). Bound to 0.0.0.0 so external tools
# (MCP Server, CI validation) can reach the REST API.
# Proxmox firewall controls network-level access to this port.
splunk_docker_mgmt_port: 8089
splunk_docker_mgmt_bind: "0.0.0.0"

# --- Managed service users + auth tokens -----------------------------------
# Create dedicated Splunk users (beyond the built-in admin) and mint each an
# authorization token, so AI agents / MCP clients get their own scoped REST +
# search identity instead of sharing the admin password. Off by default; the
# splunk inventory group enables it and supplies the user list.
splunk_docker_manage_users: false

# List of managed users. Each: { name, roles: [..] }.
#   name  - Splunk username (also the token owner / audience owner).
#   roles - Splunk roles granted (e.g. [admin], [user], [power]).
# The user's password is randomly generated once at creation and never rotated
# here — the minted token is the credential that clients actually use.
splunk_docker_users: []

# Token audience tag used to inventory enabled tokens whose not-before and
# expiry windows include the current time. Audience is DICTATED by the MCP app
# (its auth only accepts mcp), not a free-form label.
splunk_docker_token_audience: "mcp"

# Relative expiry for minted tokens (Splunk relative-time syntax, e.g. +90d).
# Empty string omits expires_on so Splunk applies its default token lifetime.
splunk_docker_token_expires_on: "+90d"

# When true, publish the shared MCP connection to OpenBao. Requires a
# write-capable OpenBao AppRole in the converge environment (see the
# *_openbao_* vars below), including KV-v2 data read/write, metadata read, and
# undelete access for the exact secret path. Inert by default: the user is
# created, but a token is minted only when it can be written to the canonical
# shared secret.
splunk_docker_token_publish_openbao: false
# Explicit one-run rotation control. When true, mint and CAS-publish exactly one
# replacement, then re-enumerate and revoke every other eligible user/audience
# token. Keep false for normal converges, which still repair a missing or
# invalid published token.
splunk_docker_token_force_rotate: false
splunk_docker_token_openbao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
splunk_docker_token_openbao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
splunk_docker_token_openbao_mount: "secret"
splunk_docker_token_openbao_path: "ai/mcp/splunk"
splunk_docker_url_openbao_key: "SPLUNK_MCP_URL"
splunk_docker_token_openbao_key: "SPLUNK_MCP_TOKEN"
splunk_docker_mcp_host: >-
  {{ (hostname ~ '.' ~ tofu_data.domain)
     if (hostname is defined and tofu_data is defined and tofu_data.domain is defined)
     else ansible_host }}
# Published URL = the Traefik-fronted `splunk-mgmt` ingress (a first-class
# tofu ingress entry), NOT the raw https://<host>:<mgmt_port> endpoint. The
# raw mgmt port serves Splunk's self-signed cert, which MCP clients rightly
# refuse — the Hermes gateway parked its splunk MCP server on exactly this
# ("failed initial connection ... parking") while the token itself was valid,
# leaving the SIEM blind for cron monitoring (2026-07-18, Zammad incident).
# Traefik terminates real TLS on the ingress name; publishing that URL makes
# every consumer verify-clean by default. Fall back to the raw mgmt URL only
# when tofu_data (and thus the ingress name derivation) is unavailable.
splunk_docker_mcp_url: >-
  {{ ('https://splunk-mgmt.' ~ tofu_data.domain ~ '/services/mcp')
     if (tofu_data is defined and tofu_data.domain is defined)
     else 'https://' ~ splunk_docker_mcp_host ~ ':' ~ splunk_docker_mgmt_port ~ '/services/mcp' }}

# Splunk Web SSL (enableSplunkWebSSL)
splunk_docker_web_ssl: true

# Health check control
# Set to false in CI (Molecule) where 127.0.0.1:8000 is unreachable from inside the test container.
splunk_docker_wait_enabled: true

# Internet access control
# Disabled by default for air-gapped/network-isolated VMs.
# When false, disables Splunkbase app browsing, update checks, and telemetry
# which otherwise cause ~80-second DNS timeout delays on every page load.
splunk_docker_allow_internet_access: false

# NOTE: HEC uses HTTPS by default (the Splunk Docker image enables SSL).
# Clients (Cribl Edge, Cribl Stream) must send to https://<host>:<hec_port>.
# The inputs.conf template does not set enableSSL, so the image default
# (SSL enabled) applies. Do not change this without updating all HEC senders.

# Splunk data directories
splunk_docker_data_dir: /opt/splunk
splunk_docker_var_dir: "{{ splunk_docker_data_dir }}/var"
splunk_docker_etc_dir: "{{ splunk_docker_data_dir }}/etc"

# Splunk configuration directory (for compose and configs)
splunk_docker_config_dir: /opt/splunk-config

# Cold-tier data directory. Default nests it under splunk_docker_data_dir, but
# operators SHOULD point this at a separate, larger/slower mounted disk when
# one exists (override in inventory) — nesting it here just gives a working
# default with no second-disk plumbing assumed.
splunk_docker_cold_dir: "{{ splunk_docker_data_dir }}/cold"

# Reserved-block percentage on the filesystem holding splunk_docker_var_dir.
# The ext4 default of 5% reserves capacity for the superuser, but splunkd runs
# unprivileged (uid 41812) and so can only use the 'available' figure. On the
# index volume that reserve is pure loss, and large enough to trip Splunk's own
# minimum free-space guard while `df` still reports plenty free. Splunk enforces
# retention itself, so the reserve protects nothing here. Set to 0 to disable
# entirely; the tuning step is skipped on filesystems without the setting.
splunk_docker_data_disk_reserved_percent: 1

# Index retention defaults
# Was a blanket 102400 MiB (100 GiB) per index, which summed to ~2.4 TiB across
# 25 indexes against a much smaller disk — a quota that couldn't bound
# anything. 10240 MiB (10 GiB) is a realistic per-index ceiling for the
# low/no-volume indexes below; the handful of genuinely high-volume metric
# indexes get an explicit override.
# 365 days in seconds: 365 * 24 * 60 * 60 = 31536000 seconds
splunk_docker_index_default_max_size_mb: 10240
splunk_docker_index_default_frozen_time_secs: 31536000

# Two Splunk volumes back the tiered indexes below:
#   hot_warm — fast storage ($SPLUNK_DB). Every "small"-tier index lives here
#              entirely (home + cold); "large"-tier indexes keep only their
#              hot homePath here.
#   cold     — larger/slower storage (splunk_docker_cold_dir). Only
#              "large"-tier indexes roll their coldPath out here.
# A cap MUST be sized against the filesystem that holds it, never against the
# sum of the per-index quotas. A cap larger than its own filesystem enforces
# nothing: the disk fills before the cap binds. That is precisely the defect
# this tiering work exists to remove, so verify_volume_capacity.yml checks the
# relationship at converge time and refuses a cap that cannot bind.
#
# UNSET BY DEFAULT, and that is the deliberate choice. Setting a cap is an
# irreversible act on a volume already holding data: the moment it binds, Splunk
# evicts the oldest buckets to get under it. Where that data goes depends
# entirely on whether the frozen archive below is enabled — archived, or gone.
#
# So the cap is opt-in per environment, sized against the real filesystem, and
# only after the archive is on. An unset cap leaves the volume uncapped, which
# is exactly the behaviour that existed before volumes were introduced: it
# enforces nothing, but it claims nothing either.
#
# Ordering that avoids data loss:
#   1. enable splunk_docker_frozen_archive_enabled and confirm buckets archive
#   2. attach the intended storage
#   3. set these caps to fit that storage, and let the preflight verify it
splunk_docker_volume_hot_warm_max_mb: ""
splunk_docker_volume_cold_max_mb: ""

# Runtime headroom alarm on the filesystem holding splunk_docker_var_dir.
#
# WHY THIS IS SEPARATE FROM verify_volume_capacity.yml: that check is a
# PREFLIGHT. It refuses to deploy a cap that could never bind. It says nothing
# about what the disk is doing days later, and the caps above are unset by
# default anyway — so on a real host today, nothing at all watches free space.
#
# Splunk's own guard is minFreeSpace, and it is a HALT, not a warning: when
# free space crosses it, indexing and search stop. The first signal an operator
# gets is the outage. These thresholds exist to fire well above that line,
# while there is still time to archive, resize, or retune.
#
# Literal MB, not expressions over splunk_docker_min_free_space_mb. validate.yml
# loads these defaults into a NAMESPACE (_splunk_docker_defaults) to survive the
# vars_files precedence trap, and a Jinja default that referenced a sibling
# default would resolve against the play scope, where that sibling does not
# exist. Keep the arithmetic in the comment, the value on the key.
#   warn = 6x minFreeSpace, fail = 3x minFreeSpace
splunk_docker_min_free_space_mb: 5000
splunk_docker_disk_headroom_warn_mb: 30000
splunk_docker_disk_headroom_fail_mb: 15000

# Freeze-path health check.
#
# A coldToFrozenScript that exits non-zero makes Splunk KEEP the bucket it just
# decided to evict. Retention silently stops enforcing, the volume fills, and
# nothing reports it — the failures land in splunkd.log and nowhere else. That
# is the exact sequence that filled the index volume: the archive upload failed
# for days while every quota looked correctly configured.
#
# Scanning splunkd.log is deliberate. The condition is only ever visible there;
# there is no counter, no health-report item, and no REST endpoint that exposes
# a failed freeze.
splunk_docker_frozen_failure_patterns:
  - "coldToFrozenScript.*exited with non-zero"
  - "refusing to freeze"
  - "bucket left on disk for retry"

# Frozen-bucket archive.
#
# Splunk DELETES a bucket when it ages out unless told otherwise. That default
# was inert while no quota could bind, but volume caps make it live: the first
# time a cap is reached, data starts leaving permanently. Enabling this turns
# ageing out into archiving.
#
# coldToFrozenDir and coldToFrozenScript are mutually exclusive in Splunk, and
# it silently prefers the Dir form when both are set — so a stray dir would
# disable the upload without any error. indexes.conf.j2 renders only one, and
# the template test asserts that.
splunk_docker_frozen_archive_enabled: false
splunk_docker_frozen_script_path: "{{ splunk_docker_etc_dir }}/system/local/cold_to_frozen.py"
# The restore half of the archive. Deployed beside the freeze script so it sees
# the same credential file; splunkd never calls it, it is run by an operator.
# Its own default for that file matches splunk_docker_frozen_config_path below,
# and SPLUNK_FROZEN_CONFIG_PATH overrides it if the layout ever moves.
splunk_docker_frozen_restore_script_path: "{{ splunk_docker_etc_dir }}/system/local/restore_from_frozen.py"
# splunkd invokes coldToFrozenScript with a restricted environment, so the
# compose-injected SPLUNK_FROZEN_S3_* vars it sees under `docker exec` are not
# visible to the script when splunkd runs it. This file is the fallback the
# script reads when the environment is empty - written next to the script
# itself, inside the same bind-mounted config volume.
splunk_docker_frozen_config_path: "{{ splunk_docker_etc_dir }}/system/local/cold_to_frozen_creds.conf"

# The archive scripts shell out to rclone instead of speaking S3 themselves: it
# provides multipart uploads with parallel parts, retry, and integrity checks,
# all of which were previously hand-written and none of which are worth owning.
#
# It lives in the config volume rather than the image because that volume is
# bind-mounted into the container, so splunkd can execute it without the vendor
# image being modified - and it survives an image upgrade, which anything
# installed into the container would not.
splunk_docker_frozen_bin_dir: "{{ splunk_docker_etc_dir }}/system/local/bin"
splunk_docker_frozen_rclone_path: "{{ splunk_docker_frozen_bin_dir }}/rclone"
# Pinned with the checksum upstream publishes for this exact archive, and
# verified before anything is unpacked. Renovate bumps the pair together; they
# must never be changed independently.
splunk_docker_rclone_version: "1.74.4"
splunk_docker_rclone_zip_sha256: "fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d"
# Left empty deliberately. Setting it alongside the script would take priority
# and silently turn archiving back into local-only retention.
splunk_docker_frozen_dir: ""

# Where the archive credential lives. The secret is read at converge time and
# passed to the container through the compose environment, never written to a
# file of its own.
splunk_docker_frozen_bao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
splunk_docker_frozen_bao_role_id: "{{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_ROLE_ID') | default('', true) }}"
splunk_docker_frozen_bao_secret_id: "{{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_SECRET_ID') | default('', true) }}"
#
# The archive lives in its own dedicated B2 bucket (`splunk`), on the
# `secrets-external` mount that separates SaaS/external credentials from
# internal ones. This bucket is NOT shared with Postgres backups (those stay
# on the old `secret/data/platform/backblaze` path, untouched) - a
# large, continuously-growing index archive does not belong in the same
# bucket as critical remote backups, and a dedicated bucket gets its own
# lifecycle policy, size cap, and least-privilege keys instead of borrowing
# someone else's. The RW key is used here because the freeze path writes.
splunk_docker_frozen_secret_path: secrets-external/data/platform/backblaze-splunk
splunk_docker_frozen_endpoint_field: B2_SPLUNK_S3_ENDPOINT
splunk_docker_frozen_bucket_field: B2_SPLUNK_BUCKET
splunk_docker_frozen_key_id_field: B2_SPLUNK_RW_KEY_ID
splunk_docker_frozen_app_key_field: B2_SPLUNK_RW_APP_KEY
# Left empty on purpose for endpoints that encode their region in the hostname.
# Setting it there and here creates two sources of truth that can silently
# disagree, and a mismatch surfaces as an opaque signature failure. Override
# only for an endpoint whose host does not carry its region.
splunk_docker_frozen_region: ""

# Idle timeout for a single transfer, in seconds - a stall detector, not a
# budget for the whole object. Size it to the worst stall the archive link
# produces, never to how long a bucket "should" take: a value tuned to
# throughput fails every large bucket and leaves it on disk forever, which is
# exactly the defect that filled the index volume. Lower it only for an archive
# target that is reliably fast, where a multi-minute stall is a real fault.
splunk_docker_frozen_upload_timeout_seconds: 900

# Concurrent transfers, and concurrent parts within a single large file. The
# offsite endpoint throttles per connection, so this - not the timeout - is what
# governs archive throughput: measured there at 318 KB/s on one connection
# versus 1.64 MB/s across eight, with per-connection speed barely moving.
# Lower it for an on-network target, where one connection is already fast and
# extra connections only add contention.
splunk_docker_frozen_upload_concurrency: 8

# Splunk's own indexes, restated so they live inside the hot/warm volume.
#
# Shipped defaults put these under $SPLUNK_DB WITHOUT referencing the volume,
# so the volume cap does not count them and each keeps the stock 500000 MB
# ceiling — larger than the filesystem holding it. Splunk says so itself on
# every bucket rebuild:
#
#   Path homePath='...' is inside volume=hot_warm ... but does not reference
#   that volume. Space used by homePath will *not* be volume-mananged.
#
# That is the same "a cap larger than its own filesystem enforces nothing"
# defect the tiered indexes above were built to remove, left in place for the
# indexes Splunk creates for itself. It matters because the guard underneath is
# minFreeSpace, and that is a HALT: indexing and search stop, and the first
# signal an operator gets is the outage.
#
# Restating them here binds them to the same volume cap as everything else, so
# one number bounds the whole filesystem. Sizes are ordered by observed volume:
# the internal/introspection pair carry real traffic, the rest are near-idle.
# These are NOT frozen to the archive — operational telemetry is not worth
# offsite storage, so they age out normally.
splunk_docker_system_indexes:
  - name: _internal
    db_dir: _internaldb
    max_size_mb: 20480
    frozen_time_secs: 2592000      # 30 days
  - name: _introspection
    db_dir: _introspection
    max_size_mb: 10240
    frozen_time_secs: 1209600      # 14 days
  - name: _audit
    db_dir: audit
    max_size_mb: 10240
    frozen_time_secs: 31536000     # 365 days — audit trail, keep a year
  - name: _telemetry
    db_dir: _telemetry
    max_size_mb: 1024
    frozen_time_secs: 5184000      # 60 days
  - name: _configtracker
    db_dir: _configtracker
    max_size_mb: 1024
    frozen_time_secs: 5184000
  - name: _thefishbucket
    db_dir: fishbucket
    max_size_mb: 1024
    frozen_time_secs: 2592000
  - name: main
    db_dir: defaultdb
    max_size_mb: 10240
    frozen_time_secs: 2592000
  - name: history
    db_dir: historydb
    max_size_mb: 1024
    frozen_time_secs: 604800       # 7 days
  - name: summary
    db_dir: summarydb
    max_size_mb: 5120
    frozen_time_secs: 2592000

# Indexes to create
splunk_docker_indexes:
  - name: ai
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # claude: highest-volume index on this instance; sized at double the shared
  # default, matching _internal.
  - name: claude
    max_size_mb: 20480
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # codex: Codex CLI agent telemetry — completes the per-agent index family
  # alongside claude/gemini/openai.
  - name: codex
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # dns: resolver query logs shipped via Cribl.
  - name: dns
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # firewall: ~46% of all ingested data (UniFi FW/IPS split, see `unifi` below).
  # tier: large — only the hot homePath lives on volume:hot_warm; coldPath
  # rolls out to volume:cold. thawedPath stays a literal $SPLUNK_DB path
  # regardless of tier — Splunk rejects a volume: reference there.
  - name: firewall
    tier: large
    home_max_size_mb: 20480
    # SIZE is the control here, not time. This index holds no old data — the
    # volume is simply large — so no realistic frozenTimePeriodInSecs evicts any
    # of it. Capping is what bounds it. An index sitting AT its cap stops
    # consuming new disk: it rolls the oldest bucket to frozen as new data
    # arrives, holding the index flat.
    #
    # 70,000 was an emergency value chosen when hot/warm and cold shared one
    # 200 GB filesystem that had reached 97% full. That constraint is gone: the
    # two tiers now sit on separate dedicated 450 GB volumes, so the cap no
    # longer has to be whatever the filesystem could survive. 102,400 MB
    # (100 GB) leaves real headroom over the ~88 GB currently held, and at the
    # measured ~1.4 GB/day for this index is roughly 72 days of retention.
    #
    # Eviction is archival, not deletion: coldToFrozenScript uploads each bucket
    # before it is removed.
    max_size_mb: 102400
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: gemini
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # hardware: host disk/health telemetry (SMART, IPMI/SEL, NVMe health, ZFS
  # fault events) shipped via Cribl exec packs + a syslog reclassify out of the
  # os catch-all — keeps index=os to OS logs/metrics only. Long retention
  # (365-day default) for drive failure-trend lookback, like the security indexes.
  - name: hardware
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # hermes: Hermes agent operational logs (gateway + watchdog via Cribl syslog
  # route hermes_agent) — dedicated index so agent health is searchable apart
  # from the shared os index.
  - name: hermes
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # honeypot: deception-fabric events (OpenCanary / T-Pot via Cribl). Security
  # index — keep the full 365-day default retention for incident lookback.
  - name: honeypot
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # host_metrics: per-host system metric series (Telegraf/collectors via Cribl)
  # — high-volume, 90-day retention matching netmon_metrics. Metric indexes
  # carry the _metrics suffix by convention (queryable via mstats, NOT events).
  - name: host_metrics
    datatype: metric
    max_size_mb: 25600
    frozen_time_secs: 7776000
  # llm: local LLM-stack telemetry (model-server manager + worker logs,
  # AI-stack process metrics, AI gateway logs) shipped via Cribl Edge -> Stream.
  - name: llm
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
    # Mac Studio LLM-stack metric events ride the llm-family Cribl output;
    # the pipeline stamps index=llm_metrics on them, but they still arrive
    # via the llm HEC token — so that token must also be allowed to write
    # to the llm_metrics index.
    extra_hec_indexes: [llm_metrics]
  # llm_metrics: LLM-stack metric series (Mac Studio + serving guests via the
  # llm-family Cribl output) — high-volume, 90-day retention matching
  # netmon_metrics. Splunkmetric -> metric index (mstats), NOT events.
  - name: llm_metrics
    datatype: metric
    max_size_mb: 25600
    frozen_time_secs: 7776000
  - name: mac_perf
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # netflow: high-volume UniFi IPFIX flow records (split from network) — 90-day
  # retention + 50 GB cap per terraform-proxmox docs/SPLUNK_INDEXES.md, not the default.
  - name: netflow
    max_size_mb: 51200
    frozen_time_secs: 7776000
  # netmon_metrics: high-volume per-WAN probe telemetry (Telegraf via Cribl) — 90-day
  # retention per terraform-proxmox docs/NETWORK_DIAGNOSIS.md, not the 365-day default.
  # Telegraf ships splunkmetric -> metric index (queryable via mstats), NOT events.
  # Metric indexes carry the _metrics suffix by convention.
  - name: netmon_metrics
    datatype: metric
    max_size_mb: 25600
    frozen_time_secs: 7776000
  # network: SUPERSEDED by `netflow` (above) — do not send new data here, and do
  # not delete it. It holds 89 real IPFIX events (sourcetype=ipfix) from a single
  # ~11h window on 2026-06-11/12 and nothing since: it WAS the live IPFIX
  # destination until the per-index HEC split moved the pipeline to index=netflow.
  # Left fully enabled ON PURPOSE. `disabled = 1` in indexes.conf makes existing
  # data unsearchable, so disabling this would destroy access to those 89 events —
  # the opposite of retiring it safely. Nothing writes here (no HEC token grants
  # it), so leaving it enabled costs nothing and keeps the history queryable.
  # It fired a permanent critical INGEST SILENCE in the Hermes digest; the fix is
  # to stop watching it (ansible-proxmox-ai #191), not to disable the index. Name
  # reconciliation across docs, the pipeline validator and the Docker Cribl
  # templates is ansible-proxmox-apps #1270.
  #
  # Counting caveat: enumerate indexes with `| eventcount summarize=false index=*`,
  # NOT `| tstats ... by index`. tstats only lists indexes with data in the search
  # window, so a 30-day tstats hides every dormant index — it showed neither these
  # 89 events nor 13 other valid indexes (28 exist here). A guard built on the
  # tstats list would reject valid indexes and fail closed.
  - name: network
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: openai
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # openbao_audit: OpenBao audit-device logs. Security/audit trail — keep the
  # full 365-day default retention for incident lookback.
  - name: openbao_audit
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: otel
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # otel_traces: OTLP trace spans (Claude Code interaction/tool/subagent spans
  # via Cribl Stream in_otel -> otel_stamp). Events, not metrics. Distinct from
  # the otel index (LLM-fabric app traces) so agent-tooling spans stay isolated.
  - name: otel_traces
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # os: host syslog. Historically a catch-all — measured 2026-07-26 it held
  # 39.3M events over 13 months from 30+ unrelated hosts, 96.9% of it a single
  # `syslog` sourcetype. os_proxmox and os_ai below carve out the two domains
  # that account for most of that volume; what remains here is the long tail,
  # and it should be driven toward zero rather than treated as a home.
  - name: os
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # os_proxmox: hypervisor syslog (pve*). 38.3% of the os catch-all's daily
  # volume when measured, the single largest slice, and the one most likely to
  # be wanted in isolation during a storage or cluster incident.
  #
  # Routing happens at the source, in the Cribl Edge syslog pipeline, keyed on
  # host. Nothing here re-routes anything: a Splunk-side index override would
  # split the data after the fact and leave the actual routing wrong.
  - name: os_proxmox
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # os_ai: AI/agent stack syslog (llm-router-*, open-webui, hermes-agent,
  # agentgateway, agent-exec, llm-light). 35.2% of the catch-all when measured.
  # Ingest here grows fastest of any os slice, so expect this one to need its
  # own retention sooner than the others.
  - name: os_ai
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # os_metrics: per-host OS metric series (CPU/memory/disk/network, incl.
  # per-process) shipped via Cribl Edge — the metric-datatype sibling of the os
  # event index. High-volume, 90-day retention matching the other _metrics
  # indexes. Splunkmetric -> metric index (queryable via mstats), NOT events.
  - name: os_metrics
    datatype: metric
    max_size_mb: 25600
    frozen_time_secs: 7776000
  # proxy: forward-proxy access logs shipped via Cribl.
  - name: proxy
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # unifi: ~29% of all ingested data. tier: large, same volume split as
  # `firewall` above.
  - name: unifi
    tier: large
    home_max_size_mb: 15360
    # Size, not time — see the sizing note on the firewall entry above.
    # 35,000 was the matching emergency value from the same 200 GB squeeze and
    # is likewise no longer necessary: 51,200 MB (50 GB) clears the ~49 GB
    # currently held. home_max_size_mb (15,360) is the hot/warm floor, so the
    # cold tier takes the remainder.
    #
    # A time threshold was tried here first and measured useless: the cold data
    # sits in buckets that are almost all the same age, so every threshold from
    # 45d to 120d evicts the same single 1 MB bucket. A bucket's age is its
    # NEWEST event and buckets span wide time ranges, which made the apparent
    # 180-day "span" misleading.
    max_size_mb: 51200
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
    # The Cribl Edge unifi_fw pipeline splits FW/IPS events out of the UniFi
    # syslog stream and stamps index=firewall on them, but they still arrive
    # via the unifi HEC token — so that token must also be allowed to write
    # to the firewall index.
    extra_hec_indexes: [firewall]
  # unifi_metrics: UniFi controller telemetry (unpoller -> Telegraf -> Cribl).
  # High-volume metric series — 90-day retention per terraform-proxmox docs, not
  # the 365-day default. Distinguished from netmon by the stream=unifi_metrics tag.
  # Telegraf ships splunkmetric -> metric index (queryable via mstats), NOT events.
  - name: unifi_metrics
    datatype: metric
    max_size_mb: 25600
    frozen_time_secs: 7776000
  - name: vscode
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # workstation: generic workstation activity text, shipped via Cribl. Larger
  # cap than the shared default — free text at volume rolls off a 10 GB cap
  # within weeks.
  - name: workstation
    max_size_mb: 51200
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"


# Per-index pipeline-silence detectors.
# Each entry renders a [<name>_silence_detector] saved search (see
# savedsearches.conf.j2) cloning the macos_edge_silence_detector shape:
# tstats latest(_time) over the index, alert when silent beyond the
# threshold. Fields:
#   name              — stanza prefix; must not collide with the bespoke
#                       detectors in savedsearches.conf.j2 (macos_edge,
#                       llm_pipeline, llm_manager_panic, llm_router*).
#   index             — index to watch.
#   threshold_minutes — silence duration that fires the alert. For a
#                       non-by_host detector this is the only threshold. For
#                       a by_host detector it is the FLOOR: the effective
#                       per-host threshold is max(that floor, the host's own
#                       observed avg_gap_minutes x cadence_multiplier), so a
#                       naturally-quiet host is not held to the same bar as a
#                       chatty one.
#   cron              — schedule (keep period well below the threshold).
#   suppress_minutes  — alert.suppress.period; throttles re-fires.
#   by_host           — optional, default false. Detect PER-HOST (`by host`
#                       + alert.suppress.fields = host) so a healthy emitter
#                       can't mask a dead one, using each host's own cadence
#                       (see threshold_minutes above). Note: a host that has
#                       never emitted has no baseline and cannot be detected.
#   cadence_multiplier — by_host only, optional, default 4. Multiplies a
#                       host's observed average inter-event gap to get its
#                       effective threshold.
#   host_overrides    — by_host only, optional, default {}. Map of
#                       hostname -> exact threshold_minutes, for a host whose
#                       computed cadence baseline is wrong (commonly: too new
#                       to have a representative average yet).
#   disabled          — optional, default 0. Set 1 to ship the stanza
#                       disabled (e.g. index exists but no emitter yet).
#   sourcetype        — optional filter added to the tstats WHERE clause.
#
# dispatch.earliest_time (the search lookback) is threshold_minutes x this
# multiplier — see the comment above each rendered stanza in
# savedsearches.conf.j2 for why it is derived per-detector rather than one
# flat window shared by a 15-minute and a 24-hour detector alike, and for the
# residual limit (a host silent longer than the window still has no row for
# tstats to return, same as an index with zero events in the whole window).
splunk_docker_silence_lookback_multiplier: 2000

splunk_docker_silence_detectors:
  - name: unifi
    index: unifi
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  # by_host means this only ever alerts on a host it currently SEES in index=os.
  # os_proxmox/os_ai/os_metrics above carve hosts out of the os catch-all at the
  # Cribl source, so a host that migrates to one of those simply stops
  # appearing here — no zero-row trip, no error, just a quieter host list than
  # this detector's own comment implies. os_proxmox and os_ai have no silence
  # detector of their own, so a host is covered by exactly one of "os" here or
  # nothing, never both.
  - name: os
    index: os
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    by_host: true
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  # hardware: alert if the hardware index stops receiving telemetry (packs /
  # Cribl / HEC dead). Shipped disabled until the Cribl hardware packs + syslog
  # reclassify are converged and index=hardware is actually emitting — a
  # silence detector on an empty index would false-fire continuously.
  #
  # FLIP THIS TO 0 IN THE SAME CHANGE THAT CONVERGES THE SYSLOG COLLECTORS.
  # Nothing else watches whether the reclassify is delivering, so while this
  # stays disabled an index that receives nothing is indistinguishable from an
  # index whose drives are all healthy — and the content alerts below cannot
  # tell you either, because a search over an empty index returns zero results
  # and reports success. This detector is the only thing that closes that gap.
  - name: hardware
    index: hardware
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 120
    by_host: true
    disabled: 1
  - name: claude
    index: claude
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 240
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  - name: dns
    index: dns
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  - name: proxy
    index: proxy
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  - name: firewall
    index: firewall
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 240
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  # The gateway emits ZERO IPFIX despite NetFlow showing enabled in its
  # console (a gateway-side export gap — the collector/receive chain is armed
  # and idle; see tofu-unifi live/gateway-telemetry.tf). Structurally-empty
  # index: ship the detector disabled so it stops firing on every cycle.
  # Flip to disabled: 0 if the gateway ever starts exporting.
  - name: netflow
    index: netflow
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    disabled: 1
  # Audit trail is low-volume; a full day of silence is the signal.
  - name: openbao_audit
    index: openbao_audit
    threshold_minutes: 1440
    cron: "0 * * * *"
    suppress_minutes: 1440
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  # Voter-health sampler ships every openbao_voter_health_interval (5min
  # default) from whichever node is Raft leader; the script itself never exits
  # non-zero on a probe failure, so this silence detector is the only signal
  # if the timer stops or the leader stops shipping. Same cadence as os/unifi.
  - name: openbao_voter_health
    index: openbao
    sourcetype: "openbao:voter:health"
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    disabled: 1  # cutover-gated pending staged re-enable, see savedsearches.conf.j2 header
  # No honeypot emitter is wired up yet — ship the stanza disabled so it
  # can be flipped on (disabled: 0) when the deception fabric starts sending.
  - name: honeypot
    index: honeypot
    threshold_minutes: 1440
    cron: "0 * * * *"
    suppress_minutes: 1440
    disabled: 1

# Firewall configuration
# DISABLED: Proxmox firewall is the single source of truth for network security.
# Guest-level iptables rules conflict with Docker's FORWARD chain and break
# container port forwarding. See terraform-proxmox/modules/firewall for rules.
splunk_docker_firewall_enabled: false

# Service user - IMPORTANT: Use splunk user UID inside container (41812)
# NOT root. This ensures proper file ownership for Splunk apps.
splunk_docker_user: "41812"
splunk_docker_group: "41812"

# Java Runtime for Splunk DB Connect
# Disabled by default; enable in inventory for hosts that need DB Connect.
splunk_docker_java_enabled: false
splunk_docker_java_version: "21"
# Pin to major version; for full pin use e.g. temurin-21-jre=21.0.7+6-1
splunk_docker_java_package: "temurin-{{ splunk_docker_java_version }}-jre"
splunk_docker_java_arch: "amd64"
splunk_docker_java_home: "/usr/lib/jvm/temurin-{{ splunk_docker_java_version }}-jre-{{ splunk_docker_java_arch }}"
# Container-internal path where the JRE is bind-mounted (decoupled from host path)
splunk_docker_java_container_home: "/opt/java"

# MS SQL Server JDBC driver for DB Connect
# Downloads mssql-jdbc from Maven Central into the DB Connect drivers/ directory.
splunk_docker_mssql_driver_enabled: false
splunk_docker_mssql_driver_version: "12.8.1.jre11"

# Artifact store (object-storage / RustFS)
# Custom add-ons with artifact_store: true are downloaded from this URL.
# The splunk-addons bucket has an anonymous read policy on the internal network
# (no auth needed). IP and port come from tofu inventory — no hardcoded values.
splunk_docker_artifact_base_url: >-
  http://{{ tofu_data.containers['s3'].reserved_ip | default(tofu_data.containers['s3'].ip, true) }}:{{
  tofu_data.constants.service_ports.object_storage_s3 }}/splunk-addons
# VisiCore TA and App are downloaded from GitHub Releases (latest) automatically.
# object-storage-sourced add-ons use version-free filenames — current version is
# tracked via the object tag, and prior versions are retained by bucket versioning.
