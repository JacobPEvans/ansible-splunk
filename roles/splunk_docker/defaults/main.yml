---
# Splunk Docker role defaults

# Docker configuration
splunk_docker_package_name: docker.io
splunk_docker_compose_package: docker-compose-plugin

# Splunk container configuration
# Splunk image - use :latest or pin a specific version like 9.1.2 when upgrading.
# Note: If specifying a version not yet pulled, ensure the VM has network access to Docker Hub.
splunk_docker_image: splunk/splunk:latest
splunk_docker_hostname: splunk
splunk_docker_container_name: splunk

# Splunk credentials (from Doppler) - set in playbook vars
splunk_docker_password: ""

# Saved-search alert delivery: ntfy + Slack, never email (operator directive
# 2026-07-16). Empty string disables that channel on every alert (the saved
# search still runs and surfaces in the Splunk UI's Triggered Alerts panel).
#
# ntfy: full topic URL, delivered via Splunk's built-in webhook alert action
# (the URL is allowlisted in alert_actions.conf.j2). Defaults to the keystone
# topic — the same one the hermes brain-watchdog pushes to — derived from
# PROXMOX_DOMAIN when the converge env carries it.
splunk_docker_alert_ntfy_url: >-
  {{ ('https://ntfy.' ~ lookup('env', 'PROXMOX_DOMAIN') ~ '/keystone')
     if lookup('env', 'PROXMOX_DOMAIN') else '' }}
# Slack: incoming-webhook URL for TA-slack-add-on-for-splunk, sourced from the
# shared alerting webhook (RUNSON_ALERT_SLACK_WEBHOOK_URL in the converge env,
# e.g. under `doppler run -p iac-conf-mgmt -c prd`). Rendered into
# alert_actions.conf (0600) — never into savedsearches.conf.
splunk_docker_alert_slack_webhook: >-
  {{ lookup('env', 'RUNSON_ALERT_SLACK_WEBHOOK_URL') | default('', true) }}

# Splunk General Terms acceptance string for SPLUNK_GENERAL_TERMS env var.
# Override in staging to point at non-prod terms acceptance strings if Splunk
# publishes a new SGT version mid-release cycle.
splunk_docker_sgt_accept: "--accept-sgt-current-at-splunk-com"

# HEC token values — dict of { index_name: token_uuid }.
# When HEC_NAMESPACE is set, a dedicated per-index token is derived for each
# index; the 'legacy' shared token always stays = SPLUNK_HEC_TOKEN so it never
# rotates while senders migrate to their per-index tokens (then it is retired).
splunk_docker_hec_token_values: {}

# HEC namespace UUID for per-index token derivation (from Doppler HEC_NAMESPACE).
# Token = 'splunk-hec-<index>' | to_uuid(namespace)  (Ansible core to_uuid =
# uuid5). Any sender with the same namespace derives the identical token, so no
# per-index secret is ever stored or shared — only this namespace UUID is.
splunk_docker_hec_namespace: ""

# Splunk ports
splunk_docker_web_port: 8000
splunk_docker_hec_port: 8088
# Management API port (splunkd REST). Bound to 0.0.0.0 so external tools
# (MCP Server, CI validation) can reach the REST API.
# Proxmox firewall controls network-level access to this port.
splunk_docker_mgmt_port: 8089
splunk_docker_mgmt_bind: "0.0.0.0"

# --- Managed service users + auth tokens -----------------------------------
# Create dedicated Splunk users (beyond the built-in admin) and mint each an
# authorization token, so AI agents / MCP clients get their own scoped REST +
# search identity instead of sharing the admin password. Off by default; the
# splunk inventory group enables it and supplies the user list.
splunk_docker_manage_users: false

# List of managed users. Each: { name, roles: [..] }.
#   name  - Splunk username (also the token owner / audience owner).
#   roles - Splunk roles granted (e.g. [admin], [user], [power]).
# The user's password is randomly generated once at creation and never rotated
# here — the minted token is the credential that clients actually use.
splunk_docker_users: []

# Token audience tag used to detect an existing live token (idempotent mint) and
# to label the token in Splunk. One token per (user, audience). Audience is DICTATED
# by the MCP app (its auth only accepts mcp), not a free-form label.
splunk_docker_token_audience: "mcp"

# Relative expiry for minted tokens (Splunk relative-time syntax, e.g. +90d).
# Empty string omits expires_on so Splunk applies its default token lifetime.
splunk_docker_token_expires_on: "+90d"

# When true, publish the shared MCP connection to OpenBao. Requires a
# write-capable OpenBao AppRole in the converge environment (see the
# *_openbao_* vars below). Inert by default: the user is created, but a token is
# minted only when it can be written to the canonical shared secret.
splunk_docker_token_publish_openbao: false
splunk_docker_token_openbao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
splunk_docker_token_openbao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
splunk_docker_token_openbao_mount: "secret"
splunk_docker_token_openbao_path: "ai/mcp/splunk"
splunk_docker_url_openbao_key: "SPLUNK_MCP_URL"
splunk_docker_token_openbao_key: "SPLUNK_MCP_TOKEN"
splunk_docker_mcp_host: >-
  {{ (hostname ~ '.' ~ tofu_data.domain)
     if (hostname is defined and tofu_data is defined and tofu_data.domain is defined)
     else ansible_host }}
# Published URL = the Traefik-fronted `splunk-mgmt` ingress (a first-class
# tofu ingress entry), NOT the raw https://<host>:<mgmt_port> endpoint. The
# raw mgmt port serves Splunk's self-signed cert, which MCP clients rightly
# refuse — the Hermes gateway parked its splunk MCP server on exactly this
# ("failed initial connection ... parking") while the token itself was valid,
# leaving the SIEM blind for cron monitoring (2026-07-18, Zammad incident).
# Traefik terminates real TLS on the ingress name; publishing that URL makes
# every consumer verify-clean by default. Fall back to the raw mgmt URL only
# when tofu_data (and thus the ingress name derivation) is unavailable.
splunk_docker_mcp_url: >-
  {{ ('https://splunk-mgmt.' ~ tofu_data.domain ~ '/services/mcp')
     if (tofu_data is defined and tofu_data.domain is defined)
     else 'https://' ~ splunk_docker_mcp_host ~ ':' ~ splunk_docker_mgmt_port ~ '/services/mcp' }}

# Splunk Web SSL (enableSplunkWebSSL)
splunk_docker_web_ssl: true

# Health check control
# Set to false in CI (Molecule) where 127.0.0.1:8000 is unreachable from inside the test container.
splunk_docker_wait_enabled: true

# Internet access control
# Disabled by default for air-gapped/network-isolated VMs.
# When false, disables Splunkbase app browsing, update checks, and telemetry
# which otherwise cause ~80-second DNS timeout delays on every page load.
splunk_docker_allow_internet_access: false

# NOTE: HEC uses HTTPS by default (the Splunk Docker image enables SSL).
# Clients (Cribl Edge, Cribl Stream) must send to https://<host>:<hec_port>.
# The inputs.conf template does not set enableSSL, so the image default
# (SSL enabled) applies. Do not change this without updating all HEC senders.

# Splunk data directories
splunk_docker_data_dir: /opt/splunk
splunk_docker_var_dir: "{{ splunk_docker_data_dir }}/var"
splunk_docker_etc_dir: "{{ splunk_docker_data_dir }}/etc"

# Splunk configuration directory (for compose and configs)
splunk_docker_config_dir: /opt/splunk-config

# Index retention defaults
# 100 GiB in MiB: 100 * 1024 = 102400 MiB (approx. "100GB" index size)
# 365 days in seconds: 365 * 24 * 60 * 60 = 31536000 seconds
splunk_docker_index_default_max_size_mb: 102400
splunk_docker_index_default_frozen_time_secs: 31536000

# Indexes to create
splunk_docker_indexes:
  - name: ai
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: claude
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # codex: Codex CLI agent telemetry — completes the per-agent index family
  # alongside claude/gemini/openai.
  - name: codex
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # dns: resolver query logs shipped via Cribl.
  - name: dns
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: firewall
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: gemini
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # hermes: Hermes agent operational logs (gateway + watchdog via Cribl syslog
  # route hermes_agent) — dedicated index so agent health is searchable apart
  # from the shared os index.
  - name: hermes
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # honeypot: deception-fabric events (OpenCanary / T-Pot via Cribl). Security
  # index — keep the full 365-day default retention for incident lookback.
  - name: honeypot
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # host_metrics: per-host system metric series (Telegraf/collectors via Cribl)
  # — high-volume, 90-day retention matching netmon_metrics. Metric indexes
  # carry the _metrics suffix by convention (queryable via mstats, NOT events).
  - name: host_metrics
    datatype: metric
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: 7776000
  # llm: local LLM-stack telemetry (model-server manager + worker logs,
  # AI-stack process metrics, AI gateway logs) shipped via Cribl Edge -> Stream.
  - name: llm
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
    # Mac Studio LLM-stack metric events ride the llm-family Cribl output;
    # the pipeline stamps index=llm_metrics on them, but they still arrive
    # via the llm HEC token — so that token must also be allowed to write
    # to the llm_metrics index.
    extra_hec_indexes: [llm_metrics]
  # llm_metrics: LLM-stack metric series (Mac Studio + serving guests via the
  # llm-family Cribl output) — high-volume, 90-day retention matching
  # netmon_metrics. Splunkmetric -> metric index (mstats), NOT events.
  - name: llm_metrics
    datatype: metric
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: 7776000
  - name: mac_perf
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # netflow: high-volume UniFi IPFIX flow records (split from network) — 90-day
  # retention + 50 GB cap per terraform-proxmox docs/SPLUNK_INDEXES.md, not the default.
  - name: netflow
    max_size_mb: 51200
    frozen_time_secs: 7776000
  # netmon_metrics: high-volume per-WAN probe telemetry (Telegraf via Cribl) — 90-day
  # retention per terraform-proxmox docs/NETWORK_DIAGNOSIS.md, not the 365-day default.
  # Telegraf ships splunkmetric -> metric index (queryable via mstats), NOT events.
  # Metric indexes carry the _metrics suffix by convention.
  - name: netmon_metrics
    datatype: metric
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: 7776000
  - name: network
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: openai
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # openbao_audit: OpenBao audit-device logs. Security/audit trail — keep the
  # full 365-day default retention for incident lookback.
  - name: openbao_audit
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: otel
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: os
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # os_metrics: per-host OS metric series (CPU/memory/disk/network, incl.
  # per-process) shipped via Cribl Edge — the metric-datatype sibling of the os
  # event index. High-volume, 90-day retention matching the other _metrics
  # indexes. Splunkmetric -> metric index (queryable via mstats), NOT events.
  - name: os_metrics
    datatype: metric
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: 7776000
  # proxy: forward-proxy access logs shipped via Cribl.
  - name: proxy
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: unifi
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
    # The Cribl Edge unifi_fw pipeline splits FW/IPS events out of the UniFi
    # syslog stream and stamps index=firewall on them, but they still arrive
    # via the unifi HEC token — so that token must also be allowed to write
    # to the firewall index.
    extra_hec_indexes: [firewall]
  # unifi_metrics: UniFi controller telemetry (unpoller -> Telegraf -> Cribl).
  # High-volume metric series — 90-day retention per terraform-proxmox docs, not
  # the 365-day default. Distinguished from netmon by the stream=unifi_metrics tag.
  # Telegraf ships splunkmetric -> metric index (queryable via mstats), NOT events.
  - name: unifi_metrics
    datatype: metric
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: 7776000
  - name: vscode
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"


# Per-index pipeline-silence detectors.
# Each entry renders a [<name>_silence_detector] saved search (see
# savedsearches.conf.j2) cloning the macos_edge_silence_detector shape:
# tstats latest(_time) over the index, alert when silent beyond the
# threshold. Fields:
#   name              — stanza prefix; must not collide with the bespoke
#                       detectors in savedsearches.conf.j2 (macos_edge,
#                       llm_pipeline, llm_manager_panic, llm_router*).
#   index             — index to watch.
#   threshold_minutes — silence duration that fires the alert.
#   cron              — schedule (keep period well below the threshold).
#   suppress_minutes  — alert.suppress.period; throttles re-fires.
#   by_host           — optional, default false. Detect PER-HOST (`by host`
#                       + alert.suppress.fields = host) so a healthy emitter
#                       can't mask a dead one. Note: a host that has never
#                       emitted has no baseline and cannot be detected.
#   disabled          — optional, default 0. Set 1 to ship the stanza
#                       disabled (e.g. index exists but no emitter yet).
#   sourcetype        — optional filter added to the tstats WHERE clause.
splunk_docker_silence_detectors:
  - name: unifi
    index: unifi
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
  - name: os
    index: os
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    by_host: true
  - name: claude
    index: claude
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 240
  - name: dns
    index: dns
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
  - name: proxy
    index: proxy
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
  - name: firewall
    index: firewall
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 240
  # The gateway emits ZERO IPFIX despite NetFlow showing enabled in its
  # console (a gateway-side export gap — the collector/receive chain is armed
  # and idle; see tofu-unifi live/gateway-telemetry.tf). Structurally-empty
  # index: ship the detector disabled so it stops firing on every cycle.
  # Flip to disabled: 0 if the gateway ever starts exporting.
  - name: netflow
    index: netflow
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    disabled: 1
  # Audit trail is low-volume; a full day of silence is the signal.
  - name: openbao_audit
    index: openbao_audit
    threshold_minutes: 1440
    cron: "0 * * * *"
    suppress_minutes: 1440
  # No honeypot emitter is wired up yet — ship the stanza disabled so it
  # can be flipped on (disabled: 0) when the deception fabric starts sending.
  - name: honeypot
    index: honeypot
    threshold_minutes: 1440
    cron: "0 * * * *"
    suppress_minutes: 1440
    disabled: 1

# Firewall configuration
# DISABLED: Proxmox firewall is the single source of truth for network security.
# Guest-level iptables rules conflict with Docker's FORWARD chain and break
# container port forwarding. See terraform-proxmox/modules/firewall for rules.
splunk_docker_firewall_enabled: false

# Service user - IMPORTANT: Use splunk user UID inside container (41812)
# NOT root. This ensures proper file ownership for Splunk apps.
splunk_docker_user: "41812"
splunk_docker_group: "41812"

# Java Runtime for Splunk DB Connect
# Disabled by default; enable in inventory for hosts that need DB Connect.
splunk_docker_java_enabled: false
splunk_docker_java_version: "21"
# Pin to major version; for full pin use e.g. temurin-21-jre=21.0.7+6-1
splunk_docker_java_package: "temurin-{{ splunk_docker_java_version }}-jre"
splunk_docker_java_arch: "amd64"
splunk_docker_java_home: "/usr/lib/jvm/temurin-{{ splunk_docker_java_version }}-jre-{{ splunk_docker_java_arch }}"
# Container-internal path where the JRE is bind-mounted (decoupled from host path)
splunk_docker_java_container_home: "/opt/java"

# MS SQL Server JDBC driver for DB Connect
# Downloads mssql-jdbc from Maven Central into the DB Connect drivers/ directory.
splunk_docker_mssql_driver_enabled: false
splunk_docker_mssql_driver_version: "12.8.1.jre11"

# Artifact store (object-storage / RustFS)
# Custom add-ons with artifact_store: true are downloaded from this URL.
# The splunk-addons bucket has an anonymous read policy on the internal network
# (no auth needed). IP and port come from tofu inventory — no hardcoded values.
splunk_docker_artifact_base_url: >-
  http://{{ tofu_data.containers['s3'].reserved_ip | default(tofu_data.containers['s3'].ip, true) }}:{{
  tofu_data.constants.service_ports.object_storage_s3 }}/splunk-addons
# VisiCore TA and App are downloaded from GitHub Releases (latest) automatically.
# object-storage-sourced add-ons use version-free filenames — current version is
# tracked via the object tag, and prior versions are retained by bucket versioning.
