---
# Configure the frozen-bucket archive.
#
# Without this, Splunk's behaviour when a bucket ages out is to DELETE it. That
# default is harmless while no quota can bind, which was the situation before
# volume caps were introduced — nothing ever froze. Once the caps actually
# enforce, the delete path becomes live, so the archive has to exist before the
# caps are trusted, not after.
#
# The credential is read from the secrets store at converge time and handed to
# the container two ways: through the compose environment (same route the
# admin password already takes - written 0600, no_log), and as a 0600 file in
# the config volume, because splunkd invokes coldToFrozenScript with a
# restricted environment that does not see the compose vars. Neither copy is
# baked into an image layer.

# Check the inputs before using them. Without this, a converge run without the
# secrets environment loaded fails on an HTTP 400 from the login endpoint, which
# says nothing about what is actually missing and sends the reader looking at
# the secrets store rather than at their own shell.
- name: Assert the frozen-archive prerequisites are present
  ansible.builtin.assert:
    that:
      - splunk_docker_frozen_bao_addr | default('', true) | length > 0
      - splunk_docker_frozen_bao_role_id | default('', true) | length > 0
      - splunk_docker_frozen_bao_secret_id | default('', true) | length > 0
    fail_msg: >-
      The frozen archive is enabled but its credential inputs are missing
      (address / role id / secret id). These come from the environment, so the
      usual cause is a converge run outside the secrets wrapper. Load it and
      re-run, or set splunk_docker_frozen_archive_enabled to false to converge
      without the archive - but note that with the archive off, any volume cap
      that binds deletes data instead of archiving it.
    quiet: true
  no_log: true

- name: Fetch the frozen-archive credential
  ansible.builtin.uri:
    url: "{{ splunk_docker_frozen_bao_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ splunk_docker_frozen_bao_role_id }}"
      secret_id: "{{ splunk_docker_frozen_bao_secret_id }}"
    status_code: [200]
  register: splunk_docker_frozen_login
  no_log: true
  delegate_to: localhost
  become: false
  # Read-path credential mint, and it must run under --check too. Skipped, the
  # dry run fails on an undefined token rather than validating anything, which
  # makes --check useless for exactly the config most worth checking first.
  check_mode: false

- name: Read the frozen-archive secret
  ansible.builtin.uri:
    url: >-
      {{ splunk_docker_frozen_bao_addr }}/v1/{{ splunk_docker_frozen_secret_path }}
    method: GET
    headers:
      X-Vault-Token: "{{ splunk_docker_frozen_login.json.auth.client_token }}"
    status_code: [200]
  register: splunk_docker_frozen_secret
  no_log: true
  delegate_to: localhost
  become: false
  # Read-only fetch; same reasoning as the login above.
  check_mode: false

# Fail on a missing field rather than deploying a script that will refuse every
# freeze at runtime. A converge-time failure is visible; a freeze that quietly
# never succeeds is not, and it silently stops reclaiming space.
- name: Assert the frozen-archive credential is complete
  ansible.builtin.assert:
    that:
      - splunk_docker_frozen_secret.json.data.data[item] | default('') | length > 0
    fail_msg: >-
      The frozen-archive secret at {{ splunk_docker_frozen_secret_path }} has no
      usable '{{ item }}'. Frozen buckets would be deleted rather than archived.
    quiet: true
  loop:
    - "{{ splunk_docker_frozen_endpoint_field }}"
    - "{{ splunk_docker_frozen_bucket_field }}"
    - "{{ splunk_docker_frozen_key_id_field }}"
    - "{{ splunk_docker_frozen_app_key_field }}"
  no_log: true

- name: Expose the frozen-archive settings to the container templates
  ansible.builtin.set_fact:
    splunk_docker_frozen_env:
      SPLUNK_FROZEN_S3_ENDPOINT: >-
        {{ splunk_docker_frozen_secret.json.data.data[splunk_docker_frozen_endpoint_field] }}
      SPLUNK_FROZEN_S3_BUCKET: >-
        {{ splunk_docker_frozen_secret.json.data.data[splunk_docker_frozen_bucket_field] }}
      SPLUNK_FROZEN_S3_KEY_ID: >-
        {{ splunk_docker_frozen_secret.json.data.data[splunk_docker_frozen_key_id_field] }}
      SPLUNK_FROZEN_S3_APP_KEY: >-
        {{ splunk_docker_frozen_secret.json.data.data[splunk_docker_frozen_app_key_field] }}
      SPLUNK_FROZEN_S3_REGION: "{{ splunk_docker_frozen_region }}"
  no_log: true

- name: Deploy the frozen-archive script
  ansible.builtin.template:
    src: cold_to_frozen.py.j2
    dest: "{{ splunk_docker_frozen_script_path }}"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0750'
  notify: Restart Splunk container

# An archive nobody can restore from is not a backup, and this script was
# shipped in the repo but never placed on a host - so the restore half of the
# frozen path had never been runnable, let alone exercised. It reads the same
# credential file written below, so it works wherever the freeze path works.
# No handler: splunkd never invokes it, so nothing needs restarting.
- name: Deploy the frozen-archive restore script
  ansible.builtin.copy:
    src: restore_from_frozen.py
    dest: "{{ splunk_docker_frozen_restore_script_path }}"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0750'

# splunkd invokes coldToFrozenScript with a restricted environment, so the
# compose-injected SPLUNK_FROZEN_S3_* vars are invisible to the script on the
# path that actually matters. A manual `docker exec` canary run inherits the
# container's configured environment and succeeds, which made this look
# working; splunkd.log showed the real path failing with "refusing to freeze,
# missing config" on every real eviction. Writing the same values to a file in
# the config volume gives the script a source that does not depend on how it
# was invoked - the environment stays checked first so the manual/canary path
# keeps working unchanged.
- name: Write the frozen-archive credential file
  ansible.builtin.copy:
    dest: "{{ splunk_docker_frozen_config_path }}"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0600'
    content: |
      SPLUNK_FROZEN_S3_ENDPOINT={{ splunk_docker_frozen_env.SPLUNK_FROZEN_S3_ENDPOINT }}
      SPLUNK_FROZEN_S3_BUCKET={{ splunk_docker_frozen_env.SPLUNK_FROZEN_S3_BUCKET }}
      SPLUNK_FROZEN_S3_KEY_ID={{ splunk_docker_frozen_env.SPLUNK_FROZEN_S3_KEY_ID }}
      SPLUNK_FROZEN_S3_APP_KEY={{ splunk_docker_frozen_env.SPLUNK_FROZEN_S3_APP_KEY }}
  no_log: true
  notify: Restart Splunk container
