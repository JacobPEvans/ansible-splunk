---
# MCP Server post-install configuration
# Called from tasks/main.yml after apps.yml installs the app archive.
#
# Deploys optional local/mcp.conf settings (ssl_verify, rate limits).

- name: Load MCP Server configuration vars
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/mcp.yml"

- name: Load Splunk add-on registry for MCP app directory lookup
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/addons.yml"
  when: splunk_docker_addons is not defined

- name: Configure MCP Server settings
  when:
    - splunk_docker_mcp_server_enabled | bool
  block:
    - name: Look up MCP Server app directory
      ansible.builtin.set_fact:
        splunk_docker_mcp_app_entry: >-
          {{ splunk_docker_addons
             | selectattr('role', 'defined')
             | selectattr('role', 'equalto', 'mcp_server')
             | list | first | default(none) }}

    - name: Check MCP Server app is installed
      ansible.builtin.stat:
        path: "{{ splunk_docker_etc_dir }}/apps/{{ splunk_docker_mcp_app_entry.app_dir }}"
      register: splunk_docker_mcp_app_dir
      when: splunk_docker_mcp_app_entry is not none

    - name: Deploy MCP Server local configuration
      when:
        - splunk_docker_mcp_app_entry is not none
        - splunk_docker_mcp_app_dir.stat.exists | default(false)
      vars:
        # Defined once and shared by the patch and its post-state assert, so the
        # check can never drift from the pattern actually applied.
        splunk_docker_mcp_message_py: >-
          {{ splunk_docker_etc_dir }}/apps/{{
          splunk_docker_mcp_app_entry.app_dir }}/bin/mcp_message.py
        # Pre-2.0 apps assigned a bare `status_code = 200` after this log line.
        # 2.0.0+ already returns http.HTTPStatus.ACCEPTED (202); keep the legacy
        # replace for older extracts and accept either form in the assert.
        splunk_docker_mcp_202_anchor: >-
          Processing notifications/initialized request.\)\s*\n\s*status_code =
        splunk_docker_mcp_202_ok: >-
          Processing notifications/initialized request["']?\)\s*\n\s*status_code\s*=\s*(?:202|http\.HTTPStatus\.ACCEPTED)
      block:
        - name: Ensure MCP Server local directory exists
          ansible.builtin.file:
            path: "{{ splunk_docker_etc_dir }}/apps/{{ splunk_docker_mcp_app_entry.app_dir }}/local"
            state: directory
            owner: "{{ splunk_docker_user }}"
            group: "{{ splunk_docker_group }}"
            mode: '0750'

        - name: Deploy MCP Server mcp.conf overrides
          ansible.builtin.template:
            src: mcp.conf.j2
            dest: "{{ splunk_docker_etc_dir }}/apps/{{ splunk_docker_mcp_app_entry.app_dir }}/local/mcp.conf"
            owner: "{{ splunk_docker_user }}"
            group: "{{ splunk_docker_group }}"
            mode: '0644'
          notify: Restart Splunk container

        # Answer notifications/initialized with HTTP 202 (No-body ACK) instead of
        # 200. A strict MCP proxy (agentgateway) JSON-parses every non-202/204 2xx
        # response body; the app's 200 + empty body hits EOF and the proxy returns
        # 500, so Hermes and Claude Code abort the session. 202 makes the proxy
        # short-circuit before parsing. The app is re-extracted from Splunkbase on
        # every version change (vars/addons.yml, no pin_version), so this bin/ patch
        # is re-applied each converge to self-heal. Anchored on the handler's log
        # line so no unrelated status_code assignment is touched, and idempotent
        # (the pattern's trailing 200 no longer matches once flipped to 202).
        # No-op when upstream already ships ACCEPTED/202 (MCP Server 2.0.0+).
        - name: Patch MCP Server notifications/initialized to return 202 (proxy compat)
          ansible.builtin.replace:
            path: "{{ splunk_docker_mcp_message_py }}"
            regexp: "({{ splunk_docker_mcp_202_anchor }} )200"
            replace: '\g<1>202'
          notify: Restart Splunk container

        # `replace` reports changed=false when its regexp matches NOTHING, which
        # is also the steady state once patched — the two are indistinguishable
        # from converge output. So an upstream refactor of this handler silently
        # drops the patch, MCP goes back to 200 + empty body, and the proxy 500s
        # every session with nothing anywhere saying why.
        #
        # Assert the POST state, not the absence of the pre state: absence is
        # equally true when the shape changed and nothing was patched.
        #
        # Accept either the legacy patched `status_code = 202` or upstream
        # `http.HTTPStatus.ACCEPTED` (2.0.0+).
        - name: Read the patched MCP Server message handler
          ansible.builtin.slurp:
            src: "{{ splunk_docker_mcp_message_py }}"
          register: splunk_docker_mcp_message_source
          changed_when: false

        - name: Assert the MCP Server 202 response is present
          ansible.builtin.assert:
            quiet: true
            that:
              - >-
                (splunk_docker_mcp_message_source.content | b64decode)
                is search(splunk_docker_mcp_202_ok)
            fail_msg: >-
              The MCP Server app's notifications/initialized handler no longer
              returns HTTP 202 (neither a patched status_code = 202 nor
              http.HTTPStatus.ACCEPTED). A strict MCP proxy will 500 on every
              session until the handler is updated.

    - name: Skip MCP configuration (app not installed)
      ansible.builtin.debug:
        msg: "MCP Server app not found — skipping configuration. Install the app first via Splunkbase."
      when: splunk_docker_mcp_app_entry is none or not (splunk_docker_mcp_app_dir.stat.exists | default(false))
