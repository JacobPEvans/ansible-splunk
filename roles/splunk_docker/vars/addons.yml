---
# Splunk Add-on Registry
#
# Fields:
#   filename       — archive name (in object-storage bucket, or github release asset).
#                    Version-free by convention; extension is cosmetic
#                    (ansible.builtin.unarchive auto-detects gzip content).
#   app_dir        — extracted directory name under /opt/splunk/etc/apps/.
#                    Equals the Splunkbase `appid` for splunkbase entries.
#   splunkbase_id  — Splunkbase numeric app ID. When present, playbooks/sync-splunkbase.yml
#                    resolves the LATEST release from the public Splunkbase API and
#                    mirrors it into object storage. When absent, the entry is skipped by the
#                    sync and must be populated manually.
#   pin_version    — optional. Hard-pin to an exact version string to hold back a bad
#                    release. When absent (the default), the entry tracks latest.
#   github_repo    — optional. If set, download from github.com/<repo> releases/latest.
#                    Mutually exclusive with splunkbase_id.
#   role           — optional. Stable identifier for entries that other playbooks
#                    look up by purpose rather than filename (e.g. role: mcp_server
#                    is used by validate.yml + tasks/mcp_server.yml so the filename
#                    can change without breaking either lookup).
#   install         — optional boolean, default true. `false` keeps a public
#                    Splunkbase package in the analysis archive only; it is never
#                    included in manifest.json or installed on the Splunk VM.
#
# Flow: sync-splunkbase.yml (control node, has internet) resolves the latest version
# per splunkbase_id, downloads it, mirrors it to the object-storage `splunk-addons` bucket, and
# writes manifest.json mapping app_dir → version. The air-gapped Splunk VM then reads
# manifest.json over the LAN and re-extracts any app whose installed version differs
# (roles/splunk_docker/tasks/apps.yml). No manual downloads; no version bumps here —
# add `pin_version` only to deliberately freeze a single app.

splunk_docker_addons:
  # --- object-storage, Splunkbase-sourced (auto-sync, tracks latest) ---
  - {filename: TA-unifi-cloud.tar, app_dir: TA-unifi-cloud, splunkbase_id: 7494}
  - {filename: duck-yeah.tar, app_dir: DuckYeah, splunkbase_id: 7015}
  - {filename: splunk-db-connect.tar, app_dir: splunk_app_db_connect, splunkbase_id: 2686}
  - {filename: Splunk_TA_H3_Unifi.tar, app_dir: Splunk_TA_H3_Unifi, splunkbase_id: 7935}
  - {filename: ubiquiti-add-on-for-splunk.tar, app_dir: TA-ubiquiti, splunkbase_id: 4107}
  - {filename: splunk-mcp-server.tar, app_dir: Splunk_MCP_Server, splunkbase_id: 7931, role: mcp_server}
  # Slack Notification Alert (splunk/slack-alerts). Official, Splunk-authored --
  # provides the [slack] alert action savedsearches.conf.j2 declares. Distinct
  # from TA-slack-add-on-for-splunk above, which is a data-input add-on with no
  # alert script (the app that never delivered anything, see Vikunja 1866).
  - {filename: slack-notification-alert.tar, app_dir: slack_alerts, splunkbase_id: 2878, role: slack_alert}
  - {filename: agent-management-versioned-app-retrieval.tar, app_dir: agent_management_versioned_app_retrieval, splunkbase_id: 8278}
  - {filename: add-on-for-traefik-proxy.tar, app_dir: splunk_traefik_addon, splunkbase_id: 6733}
  - {filename: python-for-scientific-computing-for-linux-64-bit.tar, app_dir: Splunk_SA_Scientific_Python_linux_x86_64, splunkbase_id: 2882}
  - {filename: splunk-ai-toolkit.tar, app_dir: Splunk_ML_Toolkit, splunkbase_id: 2890}
  - {filename: mltk-container.tar, app_dir: mltk-container, splunkbase_id: 4607}
  - {filename: ai-workbench-adjutant-ai.tar, app_dir: itmip_ai_splunk_assistent_app, splunkbase_id: 8747}
  - {filename: genai-observability-for-splunk.tar, app_dir: splunk_genai_observability, splunkbase_id: 8308}
  - {filename: splunk-ai-assistant.tar, app_dir: Splunk_AI_Assistant_Cloud, splunkbase_id: 7245}
  - {filename: alerts-for-splunk-admins.tar, app_dir: SplunkAdmins, splunkbase_id: 3796}
  - {filename: admin-ninja-app.tar, app_dir: admin_ninja_app, splunkbase_id: 6664}
  - {filename: admin-ninja-ta.tar, app_dir: TA_admin_ninja, splunkbase_id: 6665}
  - {filename: admin-pilot-for-splunk-ap4s.tar, app_dir: insights_app_splunk, splunkbase_id: 6489}
  - {filename: splunk-app-for-chargeback.tar, app_dir: chargeback_app_splunk_cloud, splunkbase_id: 5688}
  - {filename: sa-littlehelper.spl, app_dir: sa-littlehelper, splunkbase_id: 6368}
  - {filename: Splunk_TA_paloalto_networks.tar, app_dir: Splunk_TA_paloalto_networks, splunkbase_id: 7523}
  - {filename: splunk-add-on-for-microsoft-office-365.spl, app_dir: splunk_ta_o365, splunkbase_id: 4055}
  - {filename: splunk-add-on-for-servicenow.spl, app_dir: Splunk_TA_snow, splunkbase_id: 1928}
  - {filename: hurricane-labs-app-for-shodan.tar, app_dir: Hurricane_Labs_App_for_Shodan, splunkbase_id: 1767}
  - {filename: hurricane-labs-add-on-for-windows-powershell-transcript.tar, app_dir: TA-powershell_transcript, splunkbase_id: 4984}
  - {filename: ta-studio.tar, app_dir: ta_studio, splunkbase_id: 8932}

  # --- analysis-only Splunkbase packages (archive only; never deployed) ---
  # These identifiers are backed by a public package label plus an embedded
  # Splunkbase URL or exact appid match. They are not copies of customer config.
  - {filename: splunk-add-on-for-microsoft-windows.spl, app_dir: Splunk_TA_windows, splunkbase_id: 742, install: false}
  - {filename: splunk-add-on-for-unix-and-linux.spl, app_dir: Splunk_TA_nix, splunkbase_id: 833, install: false}
  - {filename: splunk-add-on-for-oracle-database.spl, app_dir: Splunk_TA_oracle, splunkbase_id: 1910, install: false}
  - {filename: splunk-add-on-for-jboss.spl, app_dir: Splunk_TA_jboss, splunkbase_id: 2954, install: false}
  - {filename: splunk-app-for-cisco-ise.spl, app_dir: Splunk_CiscoISE, splunkbase_id: 1589, install: false}
  - {filename: splunk-app-for-cisco-networks.spl, app_dir: cisco_ios, splunkbase_id: 1352, install: false}
  - {filename: splunk-add-on-for-cisco-networks.spl, app_dir: TA-cisco_ios, splunkbase_id: 1467, install: false}
  - {filename: splunk-app-for-palo-alto-networks.spl, app_dir: SplunkforPaloAltoNetworks, splunkbase_id: 491, install: false}
  - {filename: splunk-add-on-for-palo-alto-networks.spl, app_dir: Splunk_TA_paloalto, splunkbase_id: 2757, install: false}
  - {filename: splunk-add-on-for-microsoft-exchange.spl, app_dir: splunk_TA_microsoft_exchange, splunkbase_id: 3225, install: false}

  # --- object-storage, no Splunkbase match (manual upload; sync skips) ---
  # Hurricane Labs' Automox add-on was removed from Splunkbase. The archive is
  # still served from object storage but must be re-uploaded manually with `aws s3 cp` when
  # a new version is needed.
  - {filename: hurricane-labs-add-on-for-automox.tar, app_dir: TA-automox}

  # Slack Add-on for Splunk (TA-slack-add-on-for-splunk). Vendor distributes
  # only via direct download (not Splunkbase, no GitHub release). To rotate
  # versions, repackage `~/git/splunk/TA-slack-add-on-for-splunk/` as an
  # uncompressed .tar archive (not .tar.gz — install uses the registry filename
  # directly via ansible.builtin.unarchive) and upload to object storage with the
  # version-free filename:
  #   tar -cf slack-add-on-for-splunk.tar -C ~/git/splunk TA-slack-add-on-for-splunk
  #   aws s3 cp slack-add-on-for-splunk.tar s3://splunk-addons/slack-add-on-for-splunk.tar
  #   aws s3api put-object-tagging --bucket splunk-addons \
  #     --key slack-add-on-for-splunk.tar --tagging 'TagSet=[{Key=version,Value=3.0.0}]'
  - {filename: slack-add-on-for-splunk.tar, app_dir: TA-slack-add-on-for-splunk}

  # --- GitHub Releases: JacobPEvans/<repo>/releases/latest ---
  - {filename: VisiCore_TA_AI_Observability.spl, app_dir: VisiCore_TA_AI_Observability, github_repo: JacobPEvans/VisiCore_TA_AI_Observability}
  - {filename: VisiCore_App_for_AI_Observability.spl, app_dir: VisiCore_App_for_AI_Observability, github_repo: JacobPEvans/VisiCore_App_for_AI_Observability}

# Non-installable internal analysis references. These are intentionally separate
# from Splunkbase records: no `splunkbase_id`, no manifest entry, and no target
# installation. `license_status` records what was observed, never an inference.
splunk_docker_reference_archives:
  - source: github_tarball
    owner: jewnix
    repository: splunk-spec-files
    ref: 10.4.2
    commit: ebb0889d92780f43c5fb0eec29babea83e3f26e6
    filename: splunk-spec-files-10.4.2.tar.gz
    license_status: undeclared
